# Machine-readable half of this guide. The bash blocks in README.md are rendered
# from here — see hack/render-guides.py — so the commands a reader copies and the
# commands a tool would run are the same strings.
name: try-in-passive-mode

prerequisites:
  vars:
    note: The namespace your model servers run in, and where the controller runs (the same one unless your admin runs it elsewhere).
    run: |
      export NAMESPACE=<your-namespace>
      export CONTROLLER_NAMESPACE=${NAMESPACE}

deploy:
  passivedefault:
    note: Prints true while the controller is passive.
    run: |
      kubectl get configmap scaling-manager-controller-status -n ${CONTROLLER_NAMESPACE} \
        -o jsonpath='{.data.passiveDefault}{"\n"}'
  observevars:
    note: The model KEDA scales today, its ScaledObject, and the model it serves.
    run: |
      export SCALEDOBJECT=<its ScaledObject>
      export MODEL_ID=<the model it serves>
  observe:
    note: Add the scaling manager's trigger beside the ones that scale the model. Passive, it answers 0 and leaves the scaling to them.
    run: |
      cat > observe-trigger.yaml <<EOF
      - op: add
        path: /spec/triggers/-
        value:
          type: external-push
          name: llmsm
          metricType: AverageValue
          metadata:
            scalerAddress: scaling-manager-external-scaler.${CONTROLLER_NAMESPACE}.svc:9090
            modelID: ${MODEL_ID}
          authenticationRef:
            name: scaling-manager-external-scaler-${CONTROLLER_NAMESPACE}
            kind: ClusterTriggerAuthentication
      EOF
      kubectl patch scaledobject ${SCALEDOBJECT} -n ${NAMESPACE} --type json --patch-file observe-trigger.yaml

verify:
  mode:
    note: Needs read access to the controller's logs.
    run: |
      kubectl logs -n ${CONTROLLER_NAMESPACE} deploy/scaling-manager-controller-manager --tail=-1 \
        | grep -E 'Passive mode (entered|left|changed)'
  events:
    note: What it would have done, as Events on each ScaledObject.
    run: |
      kubectl get events -n ${NAMESPACE} --field-selector reason=PassiveRecommendation

active:
  readiness:
    note: From a checkout of the same release. Report what the model servers still need. Changes nothing.
    run: make workload-patch NAMESPACE=${NAMESPACE}
  model:
    note: The model to make active.
    run: export MODEL_ID=<the model it serves>
  switch:
    note: Make one model active. The rest stay passive. Creates the scaling-policy ConfigMap when there is none.
    run: |
      cat > passive-trial.yaml <<EOF
      data:
        passive-trial: |
          model_id: ${MODEL_ID}
          namespace: ${NAMESPACE}
          passive: false
      EOF
      kubectl create configmap scaling-manager-scaling-policy-config -n ${CONTROLLER_NAMESPACE} 2>/dev/null || true
      kubectl patch configmap scaling-manager-scaling-policy-config -n ${CONTROLLER_NAMESPACE} --patch-file passive-trial.yaml
  back:
    note: Make it passive again. It inherits the passive setting.
    run: |
      kubectl patch configmap scaling-manager-scaling-policy-config -n ${CONTROLLER_NAMESPACE} \
        --type json -p '[{"op":"remove","path":"/data/passive-trial"}]'
  all:
    note: Make every model active. Live, no restart.
    run: |
      kubectl patch configmap scaling-manager-settings -n ${CONTROLLER_NAMESPACE} --type merge \
        -p '{"data":{"passive":"false"}}'

share:
  products:
    note: The GPU product of each node.
    run: kubectl get nodes -L nvidia.com/gpu.product
  vars:
    note: The GPU product your models run on, and how many of its GPUs they may hold together.
    run: |
      export ACCELERATOR=<gpu product>
      export GPUS=<gpus>
  quota:
    note: A GPU quota for the models to share. Live.
    run: |
      kubectl patch configmap scaling-manager-settings -n ${CONTROLLER_NAMESPACE} --type merge \
        -p "{\"data\":{\"limiter\":\"quota\",\"quotas\":\"${ACCELERATOR}=${GPUS}\"}}"
  shadow:
    note: Utilization share in shadow. Live.
    run: |
      kubectl patch configmap scaling-manager-settings -n ${CONTROLLER_NAMESPACE} --type merge \
        -p '{"data":{"utilizationShare":"shadow"}}'
  status:
    note: Prints the limiter and the utilization-share mode in force.
    run: |
      kubectl get configmap scaling-manager-controller-status -n ${CONTROLLER_NAMESPACE} \
        -o jsonpath='{.data.limiter} {.data.utilizationShare}{"\n"}'
  activate:
    note: The pod-patch grant sharing needs, then the switch. While a model of a group is passive, the group only reports.
    run: |
      sed -e "s/__NAMESPACE__/${CONTROLLER_NAMESPACE}/g" -e "s/__MODEL_NAMESPACE__/${NAMESPACE}/g" \
        scaling-manager-activate.yaml | kubectl apply -f -
      kubectl patch configmap scaling-manager-settings -n ${CONTROLLER_NAMESPACE} --type merge \
        -p '{"data":{"utilizationShare":"active"}}'
  log:
    note: What it would move, from the controller's log.
    run: |
      kubectl logs -n ${CONTROLLER_NAMESPACE} deploy/scaling-manager-controller-manager --tail=-1 \
        | grep 'Utilization share: would rebalance'
  live:
    note: Make every model active. Live, no restart.
    run: |
      kubectl patch configmap scaling-manager-settings -n ${CONTROLLER_NAMESPACE} --type merge \
        -p '{"data":{"passive":"false"}}'

checkout:
  install:
    note: The same passive install from a checkout of the release tag.
    run: |
      make check-prereqs
      make setup-prereqs           # cluster admin
      make deploy-scaling-manager LLMSM_PASSIVE=true

cleanup:
  share:
    note: Sharing off first, so no transfer marks are left on pods. Wait until the status no longer says draining.
    run: |
      kubectl patch configmap scaling-manager-settings -n ${CONTROLLER_NAMESPACE} --type merge \
        -p '{"data":{"utilizationShare":"off"}}'
