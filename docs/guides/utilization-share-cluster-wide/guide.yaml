name: utilization-share-cluster-wide

steps:
  tools:
    note: Prints nothing when every tool is there.
    run: |
      for t in kubectl helm git jq yq make openssl; do command -v $t >/dev/null || echo "missing: $t"; done
  admin:
    note: Prints yes for a cluster admin.
    run: |
      kubectl auth can-i '*' '*' --all-namespaces
  pools:
    note: One InferencePool in each model namespace.
    run: |
      kubectl get inferencepools -A
  podgpus:
    note: The GPUs each model pod asks for, and the node it runs on.
    run: |
      kubectl get pods -A -l 'llm-d.ai/role in (decode,prefill)' \
        -o custom-columns='NAMESPACE:.metadata.namespace,POD:.metadata.name,GPUS:.spec.containers[*].resources.limits.nvidia\.com/gpu,NODE:.spec.nodeName'
  products:
    note: The GPU product of each node.
    run: |
      kubectl get nodes -L nvidia.com/gpu.product
  controllerns:
    note: "Where the scaling manager runs: default scaling-manager-system; to use another, set CONTROLLER_NAMESPACE=<namespace>. Every later step reads it."
    run: |
      export CONTROLLER_NAMESPACE=scaling-manager-system
  check:
    note: Read-only. Checks the tools, your rights, KEDA, Prometheus, and every namespace that runs llm-d.
    run: |
      make check-prereqs SCOPE=cluster KEDA_HELM_INSTALL=true
  setup:
    note: Cluster admin, once. Installs KEDA only if the cluster has none.
    run: |
      make setup-prereqs SCOPE=cluster KEDA_HELM_INSTALL=true
  render:
    note: Not a cluster admin? Read-only. Writes the same step to admin-setup/ for an admin to run, and applies nothing.
    run: |
      make setup-prereqs SCOPE=cluster KEDA_HELM_INSTALL=true RENDER=admin-setup
  adminrun:
    note: The cluster admin, in the directory you gave them. No checkout needed.
    run: |
      bash admin-setup/admin.sh
  vars:
    note: "Option A: quota. The GPU product from step 5, and how many of its GPUs the models may hold together."
    run: |
      export ACCELERATOR=<gpu product>
      export GPUS=<gpus>
  varskueue:
    note: "Option C: Kueue. The GPU product from step 5. Kueue's ClusterQueues give the number."
    run: |
      export ACCELERATOR=<gpu product>
  checkkueue:
    note: "Option C: Kueue. Read-only. Checks each model namespace has a LocalQueue on a GPU ClusterQueue, with its model servers on it."
    run: |
      make check-prereqs SCOPE=cluster KEDA_HELM_INSTALL=true \
        LLMSM_LIMITER=quota LLMSM_QUOTA_SCOPE=cluster LLMSM_QUOTAS="${ACCELERATOR}=-1" LLMSM_QUOTA_KUEUE=true
  install:
    note: "Option A: quota. The scaling manager, with one GPU budget for every namespace."
    run: |
      make deploy-scaling-manager SCOPE=cluster INSTALL_PHASE=scaling-manager \
        LLMSM_LIMITER=quota LLMSM_QUOTA_SCOPE=cluster LLMSM_QUOTAS="${ACCELERATOR}=${GPUS}"
  installphysical:
    note: "Option B: the cluster's GPUs. The scaling manager, with the free GPUs on the nodes as the budget."
    run: |
      make deploy-scaling-manager SCOPE=cluster INSTALL_PHASE=scaling-manager LLMSM_LIMITER=gpu-inventory
  installkueue:
    note: "Option C: Kueue. The scaling manager, with the GPU quota of Kueue's ClusterQueues as one budget for every namespace."
    run: |
      make deploy-scaling-manager SCOPE=cluster INSTALL_PHASE=scaling-manager \
        LLMSM_LIMITER=quota LLMSM_QUOTA_SCOPE=cluster LLMSM_QUOTAS="${ACCELERATOR}=-1" LLMSM_QUOTA_KUEUE=true
  plan:
    note: Read-only. Lists the model servers and writes a plan. Applies nothing.
    run: |
      make scaledobjects-plan SCOPE=cluster LLMSM_DEFAULT_SO_PLAN=share-plan.yaml
  workloads:
    note: Read-only. Checks that each model server can be scaled safely. Applies nothing.
    run: |
      make workload-patch SCOPE=cluster
  register:
    note: Applies the plan. One ScaledObject for each model server.
    run: |
      make scaledobjects-apply SCOPE=cluster LLMSM_DEFAULT_SO_PLAN=share-plan.yaml
  names:
    note: One model namespace, for the commands that follow.
    run: |
      export NAMESPACE=<one model namespace>
  budget:
    note: Read-only. Is there a budget to share, and does the GPU product resolve.
    run: |
      make utilization-share-check
  shadow:
    note: "Option A: quota. Shadow: it reports what it would move, and moves nothing."
    run: |
      make utilization-share-shadow
  shadowphysical:
    note: "Option B: the cluster's GPUs. Shadow, planning across the nodes' GPUs; it moves nothing."
    run: |
      make utilization-share-shadow PHYSICAL_GROUPS=true
  status:
    note: Read-only. The mode and the recent decisions.
    run: |
      make utilization-share-status
  activate:
    note: Let it act in every namespace that shares the budget.
    run: |
      make utilization-share-activate GRANT_SHARED=true
  events:
    note: GPUs moving between namespaces, oldest first.
    run: |
      kubectl get events -A --sort-by=.lastTimestamp | grep UtilizationShare
  log:
    note: The optimizer's decisions, from the controller's log.
    run: |
      kubectl logs -n ${CONTROLLER_NAMESPACE} deploy/scaling-manager-controller-manager --tail=-1 \
        | grep -E 'Utilization share: (rebalancing|transfer (started|ended|cancelled))'
  disable:
    note: Turn the optimizer off. The budget stays.
    run: |
      make utilization-share-off
  uninstall:
    note: Remove the scaling manager. The models keep serving; KEDA and Prometheus stay.
    run: |
      make undeploy-scaling-manager SCOPE=cluster
