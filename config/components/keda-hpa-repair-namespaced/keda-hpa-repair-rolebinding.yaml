---
# The subject has no namespace on purpose: the installer's top-level
# `namespace:` sets it to the controller's (a fixed one here would bind
# another install's ServiceAccount).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: scaling-manager-keda-hpa-repair-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: scaling-manager-keda-hpa-repair-role
subjects:
- kind: ServiceAccount
  name: scaling-manager-controller-manager
