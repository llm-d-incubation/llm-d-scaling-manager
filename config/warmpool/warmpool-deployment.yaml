apiVersion: apps/v1
kind: Deployment
metadata:
  name: llmsm-warm-pool
  labels:
    app.kubernetes.io/name: scaling-manager
    app.kubernetes.io/component: warm-pool
    # The pool's NAME. A namespace may hold more than one: a warm copy is only
    # reusable on the GPU it was loaded on, so a cluster with two accelerator
    # types needs a pool per type, and a tensor-parallel variant needs Pods
    # holding that many devices. Copy this Deployment, change this label and the
    # matching one in the template below, and that is a second pool.
    #
    # Models select a pool by name; a namespace with only one needs no selection
    # at all.
    llm-d.ai/warm-pool: default
spec:
  # K: how many models the pool can have AWAKE at once, one per Pod. Start at 1
  # and size it from measurement -- the loss model in
  # docs/proposals/fast-model-loading.md turns spike rate and hold time into K,
  # and neither has been measured on a fleet with organic traffic.
  #
  # A STARTING size only. Once the pool's ScaledObject exists, KEDA owns this
  # field -- what decides whether the pool can warm anything is
  # maxReplicaCount there against warmPoolSleepMinSize, not this number.
  replicas: 2
  # Recreate, not RollingUpdate: a surge needs a SECOND GPU before the old Pod
  # releases its own, so on a node with one free GPU the default strategy
  # deadlocks -- the new Pod Pending, the old one never terminated.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: scaling-manager
      app.kubernetes.io/component: warm-pool
      # The pool NAME is part of the selector, not decoration. Without it a
      # second pool copied from this file selects the same Pods as the first --
      # two Deployments fighting over one set, which Kubernetes warns about and
      # which makes replica accounting meaningless. Change it in all three
      # places when you copy this: the label above, here, and the template.
      llm-d.ai/warm-pool: default
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scaling-manager
        app.kubernetes.io/component: warm-pool
        # Which pool this Pod belongs to. Must match the Deployment's label
        # above: The scaling manager groups Pods by THIS one, and a Pod whose value matches no
        # declared pool holds a GPU no pool will ever lend -- which the scaling manager reports
        # rather than folding it into the first pool it finds.
        llm-d.ai/warm-pool: default
        # Membership in a model's InferencePool is added and removed by the scaling manager at
        # wake and sleep. Nothing here claims a model: an idle pool Pod belongs
        # to no InferencePool and receives no traffic.
    spec:
      # Nothing in this Pod talks to the Kubernetes API. The supervisor's only
      # API use is a ConfigMap read reached exclusively in --mock-gpus mode
      # (gputranslator.py: `if self.mock_mode and ...`), which this Pod never
      # enables -- so it needs no token, and the container that runs model code
      # should not be handed one.
      automountServiceAccountToken: false
      # runAsNonRoot is NOT set here, and that is deliberate rather than an
      # oversight. At Pod level it applies to both containers, and the launcher
      # image is not ours: FMA publishes it running as root, so the kubelet
      # refuses to create the container outright --
      #
      #   Error: container has runAsNonRoot and image will run as root
      #
      # which is a CreateContainerConfigError, not a crash: the pool holds no
      # accelerators, reports nothing, and the image pulls successfully first,
      # so the events read as a healthy start. The constraint is kept on the
      # proxy, which is ours and does run unprivileged. Dropping it here buys
      # nothing back for the launcher, because the alternative is not a
      # non-root launcher -- it is no launcher at all.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      # Spread across nodes, by preference rather than by requirement.
      #
      # The pool is insurance, and insurance concentrated on one node is not
      # insurance: losing that node loses every warm model at once, and the
      # first spike afterwards pays a full cold start for each. Preferred and
      # not required, because a pool larger than the cluster's GPU node count
      # must still schedule -- a Pod that will not start is worse than one
      # sharing a node.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: scaling-manager
                    app.kubernetes.io/component: warm-pool
      # GPU nodes are routinely tainted. Without this the Deployment sits
      # Pending on exactly the clusters it is meant for.
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      # NO RuntimeClass, deliberately.
      #
      # Most GPU clusters need none: the GPU operator makes the NVIDIA runtime
      # the default, and requesting nvidia.com/gpu above is the whole of it.
      # Nothing else in this repo sets one -- not the benchmark workloads, not
      # the e2e fixtures -- and the models this pool warms run on the same nodes
      # with the same runtime.
      #
      # A few clusters do require one to be named (the shared GPU cluster installs
      # `nvidia-legacy`). Naming it here would be guessing on behalf of every
      # other cluster, where a RuntimeClass that does not exist fails ADMISSION
      # and no Pod is ever created. So if yours needs one, add
      # `runtimeClassName: <name>` here -- and `deploy/warmpool.sh` will adopt
      # whatever the namespace's own model workloads use, so the scripted path
      # needs no flag either.
      # Long enough for the preStop drain below to finish, which the drain
      # enforces rather than assumes: it holds ONE deadline for the whole hook
      # (100s) instead of a timeout per call. Per-call timeouts sum, and for a
      # Pod holding several models they summed past this window -- so SIGKILL
      # arrived mid-drain precisely when the engines were unhealthy.
      #
      # The default 30s is
      # sized for a process that can stop immediately; a generation in flight
      # cannot, and a model whose requests run for tens of seconds needs the
      # room. SIGKILL at the end of this window cuts whatever is left, so it is
      # the real bound on how graceful the shutdown can be.
      terminationGracePeriodSeconds: 120
      containers:
        - name: inference-server
          # The launcher published by Fast Model Actuation: it spawns and
          # supervises vLLM engines inside this container. The source of our
          # fork build (used for group pools) is vendored in warmpool/supervisor/;
          # single-Pod pools run this upstream build.
          # PINNED BY DIGEST, and by digest rather than tag because this is the
          # one image here that somebody else controls. A tag can be moved; this
          # cannot. The proxy beside it has always been pinned this way, and the
          # third-party image is the one that needed it more.
          #
          # v0.8.0, the first release whose DELETE both frees the GPU and keeps
          # the launcher answering. v0.7.0 made a stop kill the engine's whole
          # process group, so worker children no longer keep GPU memory after an
          # eviction (not after the engine's API server has already died: then
          # DELETE stops nothing, on any version); v0.8.0 moved that wait off the event loop. v0.7.x is
          # skipped: there a stuck instance still blocks the launcher, /health
          # included, for up to ~30 s, which can fail the readiness probe.
          # v0.6.5 changed nothing in the launcher. All of v0.6.4 through
          # v0.8.0 ship the same vLLM (0.26.0), so sleep and wake are unchanged.
          image: ghcr.io/llm-d-incubation/llm-d-fast-model-actuation/launcher:v0.8.0@sha256:9c9d03f0d485be9b0529a1623813ebfea24066156233ee13f4177c96bcbbf656
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |
              # The engine-cache guard (docs/reference/workload-preparation.md): a cache
              # directory this user cannot write costs a compile, not the pool. The
              # engines the launcher spawns inherit what it leaves set.
              for v in VLLM_CACHE_ROOT FLASHINFER_WORKSPACE_BASE TRITON_CACHE_DIR; do
                eval "d=\${$v:-}"
                d=${d%/}
                [ -n "$d" ] || continue
                if [ "$v" = FLASHINFER_WORKSPACE_BASE ] && ! command -v find >/dev/null 2>&1; then
                  echo "engine cache $v=$d cannot be checked: this image has no find; using the engine default instead"
                  unset $v
                  continue
                fi
                # Does this filesystem report who owns a file? Some do not (SMB or Azure
                # Files with a fixed uid, a FUSE mount, NFSv4 mapping users to nobody):
                # a file this process just made reads as someone else's. There owners
                # decide nothing, and the check is only that the directory is writable.
                ecown=yes
                if mkdir -p "$d" 2>/dev/null && ecf=`mktemp "$d/.own.XXXXXX" 2>/dev/null`; then
                  [ -O "$ecf" ] || ecown=no
                  rm -f "$ecf"
                fi
                # The directory itself, then a directory of this user's own beside it,
                # else inside it. The first user to start an engine here wrote the
                # marker, a plain file, and owns the directory: what that engine made
                # under it is that user's. Another user's own directory is taken only
                # if it is a real directory this user made (-O, not a link), made 755
                # whatever the pod's umask, so no other user can write in it.
                ecu=`id -u 2>/dev/null || :`
                ecp=
                ecbad=
                ecmine=
                for p in "$d" "$d.uid-$ecu" "$d/.uid-$ecu"; do
                  if [ "$p" = "$d" ]; then
                    if [ "$ecown" = no ]; then
                      touch "$d/.writable" 2>/dev/null || continue
                    elif [ -L "$d/.writable" ] || ! touch "$d/.writable" 2>/dev/null || [ ! -O "$d/.writable" ]; then
                      continue
                    fi
                    ecmine=yes
                  else
                    [ "$ecown" = yes ] && [ -n "$ecu" ] || break
                    # One made here and then refused (a filesystem that does not
                    # report owners, seen only now) is removed, not left empty.
                    ecnew=
                    if (umask 022; mkdir "$p") 2>/dev/null; then ecnew=yes; elif [ ! -d "$p" ]; then continue; fi
                    if [ ! -d "$p" ] || [ -L "$p" ] || [ ! -O "$p" ] || ! chmod go-w "$p" 2>/dev/null || ! touch "$p/.writable" 2>/dev/null; then
                      [ -z "$ecnew" ] || rmdir "$p" 2>/dev/null
                      continue
                    fi
                  fi
                  # FlashInfer: every entry of the tree, through a link at the top, but
                  # not another user's own directory in it. A find that fails fails it.
                  if [ "$v" = FLASHINFER_WORKSPACE_BASE ] && { ecf=`find "$p/" -path "$p/.uid-*" -prune -o ! -type l -exec sh -c 'for f in "$@"; do [ -w "$f" ] || [ ! -e "$f" ] || echo "$f"; done' sh {} + 2>/dev/null || echo find`; [ -n "$ecf" ]; }; then
                    ecbad=$p
                    continue
                  fi
                  ecp=$p
                  break
                done
                if [ "$ecp" = "$d" ]; then
                  [ "$ecown" = yes ] || echo "engine cache $v=$d: this filesystem does not report file owners; using it because it is writable"
                elif [ -n "$ecp" ] && [ -n "$ecmine" ]; then
                  echo "engine cache $v=$d holds an entry this user cannot write; using $ecp, user $ecu's own"
                  eval "$v=\$ecp"
                elif [ -n "$ecp" ]; then
                  echo "engine cache $v=$d is another user's; using $ecp, user $ecu's own"
                  eval "$v=\$ecp"
                elif [ -n "$ecbad" ]; then
                  echo "engine cache $v=$d holds an entry this user cannot write; using the engine default instead"
                  unset $v
                else
                  echo "engine cache $v=$d is not writable; using the engine default instead"
                  unset $v
                fi
              done
              exec python3 /app/launcher.py \
              --host 0.0.0.0 \
              --log-level info \
              --port=8001
          ports:
            - name: supervisor
              containerPort: 8001
              protocol: TCP
          env:
            # Every cache under the shared PVC, so a model loaded once is loaded
            # for every Pod: measured on this cluster, a 1.5 GB weight read takes
            # ~2.8 s whether or not this node has served the model before, and
            # the shared torch.compile cache cuts compilation from 12.35 s to
            # 3.08 s.
            #
            # KNOWN RISK, kept deliberately for that measurement: the inductor,
            # FlashInfer and Triton caches below hold COMPILED ARTEFACTS (and
            # FlashInfer writes under its directory on every start), and they live on
            # a volume shared with whoever else mounts it. An engine that runs
            # hostile code can poison what another tenant's engine will load and
            # execute. Splitting them into a per-Pod volume closes it and gives
            # back the 9 s. That is the trade; make it deliberately rather than
            # by accident.
            # HOME is NOT the shared volume, and PYTHONNOUSERSITE is set.
            #
            # Python imports `usercustomize` from the user site directory at
            # interpreter startup, and the user site directory is derived from
            # HOME. With HOME on a volume the tenant can write, dropping
            # $HOME/.local/lib/python3.X/site-packages/usercustomize.py is
            # arbitrary code inside this GPU-holding Pod -- picked up by every
            # engine vLLM spawns, without touching argv at all. The flag makes
            # that directory inert; moving HOME means there is nothing there to
            # find in the first place.
            - name: HOME
              value: /pod-home
            - name: PYTHONNOUSERSITE
              value: "1"
            - name: HF_HOME
              value: /model-cache
            - name: VLLM_CACHE_ROOT
              value: /model-cache/vllm
            - name: FLASHINFER_WORKSPACE_BASE
              value: /model-cache/flashinfer
            - name: TRITON_CACHE_DIR
              value: /model-cache/triton
            - name: XDG_CACHE_HOME
              value: /model-cache
            - name: XDG_CONFIG_HOME
              value: /model-cache/config
            # vLLM 0.22+ computes an inductor cache dir at import through
            # getpass.getuser(), which raises KeyError under OpenShift's
            # arbitrary UID because it has no /etc/passwd entry. Seeding USER
            # makes getpass read the environment instead.
            # https://github.com/vllm-project/vllm/issues/44548
            - name: USER
              value: vllm
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              # THE ONE STRUCTURAL DIFFERENCE FROM FMA. Its controller strips
              # this from the launcher Pod (removeGPUResourceLimits) and gives
              # the GPU to a transient requester instead. When that requester
              # goes, the allocation is released while sleeping engines still
              # hold cumem handles into that device -- and another tenant takes
              # it. Measured: two of three unbound sleepers could not be woken
              # at all. The pool keeps its GPUs for as long as it keeps models.
              nvidia.com/gpu: "1"
              # Memory is a limit as well as a request because the warm set is
              # the thing worth protecting: an unbounded Pod that gets evicted
              # loses every resident model at once.
              memory: 128Gi
            requests:
              nvidia.com/gpu: "1"
              # THE MEMORY REQUEST IS THE WARM-SET BUDGET. Measured on an
              # H100: level-1 sleep moves the weights into SHARED memory, and
              # the container's cgroup is charged for all of it --
              #
              #   0.6B   1.1 GiB of weights ->  4.1 GiB charged while asleep
              #   8B    14.9 GiB of weights -> 23.4 GiB charged while asleep
              #
              # i.e. about 2.6 GiB + 1.4x the weights, per resident model. Note
              # ANONYMOUS memory barely moves, so anything watching `anon` will
              # report a sleeper as costing nothing; watch memory.current.
              #
              # Left unset, the scheduler treats a Pod holding sixteen sleeping
              # models as needing no memory at all, and the kubelet evicts it:
              # the one outcome the pool exists to prevent.
              #
              # 128Gi holds FOUR 8B models (4 x 23.4 GiB, with margin), which
              # is the number the break-even works out at: see §2.8 of
              # docs/proposals/fast-model-loading.md. The saving over keeping a
              # spare replica per model is a factor of C, the models held per
              # Pod, so C=1 is not break-even -- it is strictly worse than the
              # spare replica, which holds the same GPU and can actually serve.
              #
              # This was 48Gi, chosen before any of it was measured and against
              # a 0.6B model. For anything anyone would really pool, 48Gi gives
              # C=1 or 2: the regime where the pool loses.
              #
              # A 32B sleeper needs ~86 GiB, so C=1 even here; see
              # config/warmpool-multi-gpu, which raises the GPUs and the memory
              # together.
              memory: 128Gi
              cpu: "2"
          volumeMounts:
            - name: pod-home
              mountPath: /pod-home
            - name: model-cache
              mountPath: /model-cache
          lifecycle:
            preStop:
              # DRAIN BEFORE DYING, the same way a returned bridge drains.
              #
              # A pool Pod can be removed while a model is awake and serving --
              # the pool shrinks, a node is drained, the Deployment rolls. Without
              # this the launcher takes SIGTERM and every in-flight response is
              # cut, which is the failure the whole warm pool exists to avoid.
              #
              # Kubernetes has already stopped NEW work by the time this runs: a
              # Pod with a deletion timestamp leaves its EndpointSlice, so the EPP
              # stops dispatching. What is left is the requests already in
              # flight, and vLLM knows how to finish those -- mode=wait queues new
              # adds, keeps stepping until the running ones are done, then sleeps.
              # It is the same call the pool makes when it hands a Pod back.
              #
              # Every awake instance, not just one: a Pod holds several models and
              # which is awake is not knowable from here.
              #
              # Failing quietly is deliberate. preStop cannot save a Pod that is
              # already broken, and a hook that errors only turns a clean drain
              # into a hard kill sooner.
              exec:
                command:
                  - python3
                  - -c
                  - |
                    import json, time, urllib.request
                    # One deadline for the whole hook, not a timeout per call.
                    # Per-call timeouts SUM: listing plus one /is_sleeping per
                    # resident model plus the sleep itself came to 120s or more
                    # for a Pod holding several, which is the grace period, so
                    # SIGKILL landed mid-drain exactly when the engines were
                    # unhealthy and the drain mattered most. 100s leaves the
                    # interpreter room to start and the kubelet room to act.
                    deadline = time.monotonic() + 100
                    def left(cap):
                        return max(1, min(cap, deadline - time.monotonic()))
                    def post(url):
                        try:
                            urllib.request.urlopen(urllib.request.Request(url, method="POST"), timeout=left(110)).read()
                        except Exception as err:
                            print("drain:", url, err)
                    try:
                        raw = urllib.request.urlopen("http://127.0.0.1:8001/v2/vllm/instances", timeout=left(5)).read()
                        for inst in json.loads(raw).get("instances", []):
                            if time.monotonic() >= deadline:
                                print("drain: out of time before every instance was checked")
                                break
                            opts = (inst.get("options") or "").split()
                            port = next((opts[i + 1] for i, f in enumerate(opts) if f == "--port"), None)
                            if not port:
                                continue
                            try:
                                st = json.loads(urllib.request.urlopen(f"http://127.0.0.1:{port}/is_sleeping", timeout=left(5)).read())
                            except Exception:
                                continue
                            if not st.get("is_sleeping", True):
                                post(f"http://127.0.0.1:{port}/sleep?level=1&mode=wait")
                    except Exception as err:
                        print("drain: could not list instances:", err)
          readinessProbe:
            # The supervisor being up says nothing about whether a model is
            # awake -- that is the proxy's /readyz. This probe only reports that
            # the Pod can accept instructions.
            #
            # exec, not httpGet: :8001 is closed to everything but the
            # controller, and a kubelet probe comes from the node, which no
            # NetworkPolicy `from:` selector can name. An httpGet probe here
            # would depend on whether the CNI happens to permit host traffic.
            # Run inside the container, it depends on nothing.
            exec:
              command:
                - python3
                - -c
                - |
                  import sys, urllib.request
                  try:
                      urllib.request.urlopen("http://127.0.0.1:8001/health", timeout=3)
                  except Exception as err:
                      print(err); sys.exit(1)
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            # exec for the same reason as the readiness probe above.
            #
            # A wedged supervisor otherwise holds its GPU indefinitely: nothing
            # else in the system can restart it, and the models it holds are
            # unreachable.
            exec:
              command:
                - python3
                - -c
                - |
                  import sys, urllib.request
                  try:
                      urllib.request.urlopen("http://127.0.0.1:8001/health", timeout=5)
                  except Exception as err:
                      print(err); sys.exit(1)
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
        # The Pod's serving port. Engines bind their own ports for life and a
        # sleeping process keeps its socket, so they cannot take turns binding
        # the port the InferencePool dials. This owns it and follows whichever
        # model is awake; the scaling manager re-points it through the control endpoint.
        # THE IMAGE BELOW is built from this repository (Dockerfile.warmpool-proxy):
        # ci-main-image.yaml publishes :main on every push to main, and
        # ci-release.yaml publishes :<release tag>. It follows the controller's
        # newTag: :main between releases, the release's tag on a release commit
        # (the release run refuses a tag whose commit names another), and :main
        # again after the reset PR (docs/developer-guide/release-process.md).
        # Run make warmpool-render after changing it. (Kept above this entry:
        # check-warmpool-manifests.sh reads the image with a -A12 window from
        # `name: proxy`, so comments inserted below it break the check.)
        - name: proxy
          # Build your own from this tree with `make docker-build-warmpool-proxy
          # docker-push-warmpool-proxy WARMPOOL_PROXY_IMG=<ref>`
          # (Dockerfile.warmpool-proxy) and pass --proxy-image.
          image: ghcr.io/llm-d-incubation/llm-d-scaling-manager/warmpool-proxy:main
          imagePullPolicy: IfNotPresent
          args:
            - --port=8000
            - --control-port=8002
            - --v=2
          ports:
            - name: serving
              containerPort: 8000
              protocol: TCP
            - name: proxy-control
              containerPort: 8002
              protocol: TCP
          livenessProbe:
            # exec, through the proxy binary itself: the image is distroless, so
            # there is no curl and no shell, and the binary is the only thing
            # available to make the request with. The request goes to loopback
            # inside this container, so the NetworkPolicy does not apply to it.
            #
            # Deliberately NOT on the serving port. That port is reachable by
            # every Pod in the namespace, and wiring container restarts to it
            # would let a tenant's traffic restart this proxy: with a per-token
            # flush and 500m of CPU, ~30 s of slow responses is enough.
            exec:
              command: ["/warmpool-proxy", "--check=live", "--control-port=8002"]
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            # THIS is what holds the Pod out of its InferencePool while it
            # sleeps: /readyz answers 200 only when a model is awake here.
            #
            # An ordinary probe rather than a readiness GATE that scaling manager patches --
            # Fast Model Actuation reaches the same conclusion from the other
            # side, never writing Pod status and leaving readiness to the
            # kubelet. So the controller needs no `pods/status` permission, and
            # a Pod whose controller has died still stops taking traffic when
            # its model sleeps.
            #
            # periodSeconds and failureThreshold are load-bearing, not defaults.
            # Deactivate drains the proxy (readiness fails, forwarding goes on),
            # waits DrainWait for the kubelet and the EPP to notice, clears it,
            # then sleeps the engine -- so the kubelet must notice within that
            # wait, or the EPP keeps dispatching to a Pod about to lose its
            # upstream. With the
            # defaults (period 5, failureThreshold 3) it takes 5-20 s to mark
            # the Pod NotReady while the engine sleeps at ~2 s, leaving the Pod
            # in its InferencePool with nothing awake behind it: every dispatch
            # 503s for up to 18 s, on EVERY sleep. That is precisely the
            # Ready-but-asleep window this whole design exists to avoid.
            exec:
              command: ["/warmpool-proxy", "--check=ready", "--control-port=8002"]
            initialDelaySeconds: 3
            periodSeconds: 1
            failureThreshold: 1
            timeoutSeconds: 2
          securityContext:
            # Kept here rather than at Pod level, where it would also bind the
            # launcher and stop that container being created at all.
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
      volumes:
        # A HOME of its own, per Pod. See the PYTHONNOUSERSITE note above: a
        # writable HOME on the SHARED volume is an execution channel into this
        # Pod, and nothing in a home directory needs to outlive it.
        - name: pod-home
          emptyDir: {}
        # PREREQUISITE, not created here: the PVC belongs to whoever owns the
        # models, and the pool mounts it to reuse a cache that is already warm.
        # Applying this directory into a namespace without `model-pvc` leaves
        # the Pod Pending on a missing volume.
        #
        # IT MUST BE ReadWriteMany, and that is what makes the pool scalable at
        # all. Every Pod mounts it, and Pods land on different nodes -- so with
        # an RWO claim the FIRST replica runs and the second is stuck Pending on
        # a multi-attach error, forever. Nothing else in the system reports that
        # as anything other than a pool which never grew.
        #
        # It is also what makes a Pod on a node that has never served a model
        # cheap: the weights are read from shared storage rather than fetched,
        # and the torch.compile cache another Pod populated is already there.
        # Measured on Spectrum Scale, the read costs about the same whether or
        # not that node has served the model before. A node-local volume would
        # be faster still and would give this up entirely -- every new node
        # would start cold.
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-pvc
