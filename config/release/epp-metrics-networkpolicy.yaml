# Lets the scaling manager's controller, in __NAMESPACE__, reach the EPP's
# /metrics port (9090) in a model namespace, for the one manifest
# (scaling-manager-monitoring.yaml, applied with kubectl apply -n <namespace>
# -l scaling-manager.llmd.ai/monitor=epp-networkpolicy).
#
# Only for a namespace that already denies ingress by default. A
# NetworkPolicy isolates the pods it selects, and this one selects every pod
# of the namespace, since router charts label their EPP pods differently: in
# a namespace with no policy it would cut every other ingress. Where a
# default deny is in place every pod is isolated already, and this only adds
# the controller on port 9090.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: scaling-manager-epp-metrics
  labels:
    app.kubernetes.io/name: scaling-manager
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: __NAMESPACE__
      podSelector:
        matchLabels:
          app.kubernetes.io/name: scaling-manager
          control-plane: controller-manager
    ports:
    - port: 9090
      protocol: TCP
