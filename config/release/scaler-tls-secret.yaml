# The external scaler's three certificate Secrets, empty. The controller
# fills them (--external-scaler-tls-bootstrap): it may get and update them by
# name and may not create Secrets, so these must exist. Created once with
# kubectl create, never applied: a re-apply would set the data back to empty,
# and the controller would mint a new CA into it, which KEDA refuses until its
# operator restarts. kubectl create of an existing one fails with
# AlreadyExists, which is the point. Same names and label as
# deploy/lib/scaler_tls.sh, so an install made with make already has them.
apiVersion: v1
kind: Secret
metadata:
  name: scaling-manager-external-scaler-ca
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/managed-by: llm-d-scaling-manager
    scaling-manager.llmd.ai/scaler-tls: ca
type: kubernetes.io/tls
data:
  tls.crt: ""
  tls.key: ""
  ca.crt: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: scaling-manager-external-scaler-tls
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/managed-by: llm-d-scaling-manager
    scaling-manager.llmd.ai/scaler-tls: serving
type: kubernetes.io/tls
data:
  tls.crt: ""
  tls.key: ""
  ca.crt: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: scaling-manager-external-scaler-client-tls
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/managed-by: llm-d-scaling-manager
    scaling-manager.llmd.ai/scaler-tls: client
type: kubernetes.io/tls
data:
  tls.crt: ""
  tls.key: ""
  ca.crt: ""
