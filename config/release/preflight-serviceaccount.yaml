# The preflight's own account, never the controller's: a grant made for the
# preflight never widens the controller. Delete the preflight objects after the
# install if you want them gone; they hold no secret.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scaling-manager-preflight
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: scaling-manager
    app.kubernetes.io/component: preflight
