# The external scaler's three certificate Secrets on the one manifest
# (scaling-manager.yaml): Opaque and with no data, so a server-side re-apply
# keeps what the controller wrote (--external-scaler-tls-secrets=opaque).
# New names: the kubernetes.io/tls Secrets of an smt or release-files install
# cannot change type. While these are empty, the controller copies that
# install's certificates across, so KEDA keeps the CA it trusts.
apiVersion: v1
kind: Secret
metadata:
  name: scaling-manager-scaler-ca
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/managed-by: llm-d-scaling-manager
    scaling-manager.llmd.ai/scaler-tls: ca
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: scaling-manager-scaler-serving
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/managed-by: llm-d-scaling-manager
    scaling-manager.llmd.ai/scaler-tls: serving
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: scaling-manager-scaler-client
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/managed-by: llm-d-scaling-manager
    scaling-manager.llmd.ai/scaler-tls: client
type: Opaque
