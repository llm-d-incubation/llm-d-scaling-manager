# KEDA's copy of the scaler's client certificate, in KEDA's namespace, for the
# install from the one release manifest (scaling-manager-keda.yaml, applied
# with kubectl apply -n <KEDA's namespace>, proposal PR #404). No namespace
# here, so KEDA elsewhere needs no edit. Opaque and with no data: the
# controller fills it by name (the kedaNamespace setting), and a server-side re-apply of
# a Secret with no data field keeps what the controller wrote. The
# ClusterTriggerAuthentication reads it. Same name and label as the copy smt
# admin-finish makes.
apiVersion: v1
kind: Secret
metadata:
  name: scaling-manager-external-scaler-__NAMESPACE__
  labels:
    app.kubernetes.io/managed-by: llm-d-scaling-manager
    scaling-manager.llmd.ai/scaler-tls: keda-client
type: Opaque
