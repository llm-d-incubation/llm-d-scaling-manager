# The reads the in-controller preflight (--self-check-interval) needs beyond
# the controller's own ClusterRole, all read-only and by name where a name is
# known: the preflight Job's ClusterRole (preflight-cluster-clusterrole.yaml)
# less what the controller already holds, and less create on
# subjectaccessreviews, which would let the controller ask what any account
# may do; rbac.controller is UNKNOWN without it. Plus list on rolebindings and
# clusterrolebindings for the conflicts check, which the role writer reads too,
# to find the namespaces holding its per-namespace grant: it shows the cluster's RBAC
# layout to whoever can act as the controller, the cluster admin alone here
# (appendix C of the kubectl install proposal).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: scaling-manager-self-check
  labels:
    app.kubernetes.io/name: scaling-manager
    app.kubernetes.io/component: preflight
rules:
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  resourceNames:
  - scaledobjects.keda.sh
  - clusterqueues.kueue.x-k8s.io
  - localqueues.kueue.x-k8s.io
  - resourceflavors.kueue.x-k8s.io
  - workloads.kueue.x-k8s.io
  verbs: ["get"]
- apiGroups: ["apiregistration.k8s.io"]
  resources: ["apiservices"]
  resourceNames: ["v1beta1.external.metrics.k8s.io"]
  verbs: ["get"]
- apiGroups: ["keda.sh"]
  resources: ["clustertriggerauthentications"]
  resourceNames: ["scaling-manager-external-scaler-__NAMESPACE__"]
  verbs: ["get"]
- apiGroups: ["monitoring.coreos.com"]
  resources: ["podmonitors", "prometheuses"]
  verbs: ["list"]
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["rolebindings", "clusterrolebindings"]
  verbs: ["list"]
