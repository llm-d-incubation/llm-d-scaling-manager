# Counting cohort borrowing (kueueBorrow, on by default) reads Workloads and
# LocalQueues in every namespace: a lender waiting elsewhere must stop new
# borrowing. That reaches every tenant's Workloads, so it is a ClusterRole of
# its own; delete it (and its binding) if you set kueueBorrow to "false".
# Without it borrowing is withheld as lenders-unreadable; the nominal bound
# still holds. The grant pl_grant_kueue_borrow_read
# (deploy/lib/physical_limiter.sh) makes.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: scaling-manager-kueue-borrow-reader-role-__NAMESPACE__
  labels:
    app.kubernetes.io/name: scaling-manager
rules:
- apiGroups: ["kueue.x-k8s.io"]
  resources: ["workloads"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["kueue.x-k8s.io"]
  resources: ["localqueues"]
  verbs: ["get", "list"]
