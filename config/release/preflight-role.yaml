# What the preflight reads in the controller's namespace, and the one object
# it writes: its result, scaling-manager-preflight-result. It reads no Secret:
# the Prometheus CA is mounted into the Job, and the scaler's chain is read by
# a TLS handshake and checked against the CA certificate the controller
# publishes in its status ConfigMap. create cannot be narrowed by name, so it
# may create a ConfigMap here; the code creates only its result
# (internal/preflight, WriteResult).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: scaling-manager-preflight
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: scaling-manager
    app.kubernetes.io/component: preflight
rules:
# The settings, the configuration an install made before v0.11.0 falls back
# to, the marker that KEDA's side of mutual TLS is in place, the controller's
# status (scalerCACert, scalerUnreachable), and the result.
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames:
  - scaling-manager-settings
  - scaling-manager-manager-config
  - scaling-manager-scaler-keda-auth
  - scaling-manager-controller-status
  - scaling-manager-preflight-result
  verbs: ["get"]
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["scaling-manager-preflight-result"]
  verbs: ["update"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["create"]
# Whether the controller is installed yet, and the scaler NetworkPolicy.
- apiGroups: [""]
  resources: ["serviceaccounts"]
  resourceNames: ["scaling-manager-controller-manager"]
  verbs: ["get"]
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  resourceNames: ["scaling-manager-external-scaler"]
  verbs: ["get"]
# The model-server pods and the PodMonitor that scrapes them, in this
# namespace only. For a namespace watchNamespaces adds, grant the same two
# reads there (docs/reference/preflight.md).
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["list"]
- apiGroups: ["monitoring.coreos.com"]
  resources: ["podmonitors"]
  verbs: ["list"]
