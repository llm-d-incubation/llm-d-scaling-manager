# Known failures of the learner property tests (docs/proposals/analyzer-learner.md, 2.6).
#
# Each row is a property case that fails on today's code, and the violation
# kind it fails with (expect). TestLearnerProperties requires a listed case to
# fail with that kind: failing with another kind is a new failure, and passing
# on every seed breaks the build until the row is removed. A row naming no
# case is an error. A PR that fixes a row removes it; one that changes a case
# or its generator restates measured. Nothing here is skipped, and no
# tolerance is widened to pass a defect.
#
# id is class/learner/case, as the test names it; rows are sorted by id.
# measured is the fail rate over the case's seeds and the first failure, when
# the row was written. owner is what clears the row: an issue ("ev-shindin/llm-scaling-manager#394"), or
# "open". CheckLedger holds that form only, so a closed issue passes.
- id: edges/mu/sibling-tolerance-excursion
  class: edges
  learner: mu
  expect: flipped
  finding: "The crossing is fixed: with the weighing's band (mu-weighing-band) it changes the source once. What still flips is a key's first reading landing in a noise trough (sigma 10 %, lag-one 0.3): the first set is on the first reading, it sets the weighing while the noise-free reader is at 0.95 of h, it is provisional and lets go once its own set-window mean is back at 0.90 (about 3 min, where the 10 min dwell held it before), and the crossing sets it again. The fix for that seals the closed-loop probe: 45 s of readings before a first set took a replica slow at 0.3 from the start to a peak of 27 against the 21.7 bound (105 s: 57), and setting a young key only under 0.75 sealed a replica slow at 0.65 mid-run at 24 (0/20 and 2/20 flips here then)."
  measured: "3/100 seeds, the same seeds before and after issue #60; seed 3: the source reversed at cycles 40 and 89 (40 and 72 before issue #60, whose re-set on the clear window as well puts the crossing's set 7 to 20 cycles later)"
  owner: "ev-shindin/llm-scaling-manager#495"
- id: edges/mu/sibling-tolerance-excursion-sigma15
  class: edges
  learner: mu
  expect: flipped
  finding: "As edges/mu/sibling-tolerance-excursion at the high end of the measured rate noise (sigma 15 %, lag-one 0.3): every failing seed is the 10 % row's first-reading trough, a set in the key's first cycles that clears (at the provisional clear, or after the dwell) before the crossing sets it again. Since issue #55 the readers' samples are their latest reads, no longer their max, so the reader's ratio carries its full per-read noise; since issue #60 a key that has cleared sets again only once the clear window's mean is under the tolerance too, so that noise no longer re-sets it mid-run, and the crossing's set comes 7 to 20 cycles later. The fixes that remove the first-reading trough seal the closed-loop probe (see the 10 % row)."
  measured: "16/100 seeds, the same seeds before and after issue #60; seed 3: the source reversed at cycles 40 and 89 (40 and 72 before issue #60; 14/100 before issue #55, when each replica's re-reads folded by their max and read high)"
  owner: "ev-shindin/llm-scaling-manager#495"
- id: edges/shape-hold/tolerance-excursion-stress
  class: edges
  learner: shape-hold
  expect: flipped
  finding: "Under assumed stress noise on the output length (4 %, phi 0.9; E1 measures 0.5-0.9 %, where the main case passes) the shape tracker, which moves its anchor and the key on one reading past 20 % and anchors on that reading, is moved a second time by one tail reading and back by the next."
  measured: "5/1000 seeds (64, 247, 407, 901, 926); seed 64, down to 775: 1000 -> 792 at cycle 91 -> 630 at 171 -> 765 at 185"
  owner: "ev-shindin/llm-scaling-manager#495"
- id: liveness/floor/closed-loop-decode-step-start-463s-jsq
  class: liveness
  learner: floor
  expect: over-priced
  finding: "At a 463 s start the decode step (need 17), with no restart, overshoots to 31 replicas when the first order lands and is still at 23 at the backlog allowance (44m15s): the first replicas hold their start's queue full while the joiners carry the arrivals, and occupancy counts both. At the shortest-queue limit (a bound on the EPP, not the observed router) each replica that joins a queued fleet fills to the fleet's queue at once, and occupancy reads every replica full while the queue drains (ev-shindin/llm-scaling-manager#520)."
  measured: "1/1 seed; shortest-queue limit: peak 31 at 23.25 min (ceiling 26.5), 24 from 39.25 min, 23 from 42.25 min, final 23 at 44m15s against the 20.5 bound, never under need"
  owner: "ev-shindin/llm-scaling-manager#520"
- id: liveness/floor/closed-loop-restart-before-step-start-463s-jsq
  class: liveness
  learner: floor
  expect: over-priced
  finding: "At a 463 s start the decode step after a controller restart, with no mu yet, climbs to 28 replicas, over the 26.5 ceiling (44 before the queue was priced by drain time), and is at 23 at the backlog allowance (44m15s). At the shortest-queue limit (a bound on the EPP, not the observed router) each replica that joins a queued fleet fills to the fleet's queue at once, and occupancy reads every replica full while the queue drains, and with no mu the floor cannot order against it (ev-shindin/llm-scaling-manager#520)."
  measured: "1/1 seed; shortest-queue limit: peak 28, final 23 at 44m15s against the 20.5 bound, under need 15s (bound 11m13s); switch off: peak 44, final 23, under need 8m0s"
  owner: "ev-shindin/llm-scaling-manager#520"
- id: liveness/floor/closed-loop-restored-snapshot-start-463s-jsq
  class: liveness
  learner: floor
  expect: over-priced
  finding: "At a 463 s start the decode step through a restored snapshot overshoots to 31 replicas and is at 23 at the backlog allowance (44m15s), the same trace as with no restart. At the shortest-queue limit (a bound on the EPP, not the observed router) each replica that joins a queued fleet fills to the fleet's queue at once, and occupancy reads every replica full while the queue drains (ev-shindin/llm-scaling-manager#520)."
  measured: "1/1 seed; shortest-queue limit: peak 31 at 23.25 min (ceiling 26.5), 23 from 42.25 min, final 23 at 44m15s against the 20.5 bound, never under need"
  owner: "ev-shindin/llm-scaling-manager#520"
- id: liveness/k2/flow-control-on
  class: liveness
  learner: k2
  expect: not-learned
  finding: "k2 is learned only from an engine queue at or over the threshold, and here the engines' own queues read empty while 40 requests wait at the scheduler, so P1-obs never fires and the variant prices from k1. That is not specific to flow control. On a P/D run (a TTFT staircase, flow control on and off alike) no k2 was learned below the knee in either mode, and the router queue was empty at every step before the runaway: prefill admits every prompt it holds (its queue read 0) and decode's waiting count was all deferred KV pulls. Prefill was then priced at k1 with no throughput floor, which under-provisioned TTFT by 1-2 replicas and more. Since issue #51 a prefill with no mu keeps the router queue's prompts as demand (known-truth/floor/prefill-without-mu-keeps-router-prompts), and since issue #97 it is priced at the floor on its busy-share bound with its own queue and the router's empty (liveness/floor/prefill-below-the-knee, its prefill twin, passes). What is left is this decode-only case: no k2 is learned, and here the true capacity is above k1, so a learned k2 could not move capacity. Gating k2 on the router queue is unsound: one loaded pod holds the pool, and a simulated gate learned k2 at 0.59 of k1."
  measured: "20/20 seeds; two decode replicas full for 3 min with 40 requests at the scheduler: no k2"
  owner: "#51"
