name: CI - Release - Docker Container Image

# One trigger. This used to run on `push: tags v*` AND `release: published`, so
# a release built and pushed the same image twice. Publishing a release in the
# UI with a new tag creates that tag, which fires this push event.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# One group for every release, not one per tag. Two tags released side by side
# each decide whether they are the highest from the tags they fetched; the
# older run could finish last and move `latest` back. In one group the runs go
# one at a time, and each sees every tag pushed before it started. GitHub keeps
# one run waiting: a third tag pushed meanwhile replaces the waiting one, which
# must then be re-run by hand. hack/check-release-latest.sh checks this block.
concurrency:
  group: ci-release
  cancel-in-progress: false

jobs:
  # The same lint, unit-test, deploy-script, docs and kustomize jobs a PR must
  # pass, run against the tagged commit. Nothing is pushed unless they pass:
  # before this, a tag published an image no workflow had built or tested.
  # (The e2e jobs in that workflow run only on pull_request and skip here.)
  checks:
    uses: ./.github/workflows/ci-pr-checks.yaml
    permissions:
      contents: read
      pull-requests: read

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless cosign signing: the workflow's OIDC identity is the signer.
      id-token: write
    # For the release-files job, which renders the manifests by this digest.
    outputs:
      image: ${{ steps.meta.outputs.image }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Nothing after this needs git credentials; do not leave the token in
          # .git/config beside a docker build context.
          persist-credentials: false
          # Every tag, so the step below can tell whether this one is the
          # highest final release. A shallow checkout has none of the others.
          fetch-depth: 0
          fetch-tags: true

      # Only a commit on a release line is released: one on main, or, for a
      # patch to an older line, one on that line's release-MAJOR.MINOR branch,
      # and only for a line that already has a tag on main. Anyone who may push
      # a tag could otherwise publish, sign and move `latest` to any commit. The
      # branch is the tag's own line, so a v0.11.0 tag on release-0.10 is
      # refused. Review is enforced by branch rules, not here. The full checkout above already
      # holds both branches; each is fetched only if not. A failed fetch leaves
      # the ref missing, which refuses. hack/check-release-latest.sh runs this
      # step too.
      - name: Refuse a tag that is not on main or its release branch
        id: onmain
        run: |
          set -euo pipefail
          if ! git rev-parse --verify -q refs/remotes/origin/main >/dev/null; then
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          fi
          if git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "${GITHUB_SHA} is on main"
            exit 0
          fi
          line="$(printf '%s' "$GITHUB_REF_NAME" | sed -nE 's/^v((0|[1-9][0-9]*)\.(0|[1-9][0-9]*))\.[0-9].*$/\1/p')"
          if [ -n "$line" ]; then
            branch="release-$line"
            if ! git rev-parse --verify -q "refs/remotes/origin/$branch" >/dev/null; then
              git fetch --no-tags origin "+refs/heads/$branch:refs/remotes/origin/$branch" || true
            fi
            if git rev-parse --verify -q "refs/remotes/origin/$branch" >/dev/null \
              && git merge-base --is-ancestor "$GITHUB_SHA" "refs/remotes/origin/$branch"; then
              # Only a line already released from main has a patch branch, so
              # pushing a new release-9.0 branch cannot publish a v9.0.0.
              if [ -z "$(git tag --merged refs/remotes/origin/main --list "v$line.*")" ]; then
                echo "::error::${GITHUB_SHA} is on $branch, but no v$line.* tag is on main; $line was never released from main, refusing to release it"
                exit 1
              fi
              echo "${GITHUB_SHA} is on $branch"
              exit 0
            fi
          fi
          echo "::error::tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on main or on release-${line:-MAJOR.MINOR}; refusing to release it"
          exit 1

      # The image goes to the repository owner's namespace, as ci-main-image.yaml
      # does: ghcr.io/llm-d-incubation/llm-d-scaling-manager here, which is what
      # config/base/manager/kustomization.yaml and the Makefile's IMG name. It
      # used to be hardcoded to ghcr.io/llm-d/..., an org this repository cannot
      # write to.
      #
      # Only the HIGHEST final semver tag moves `latest`. A v1.2.0-rc1 used to
      # overwrite it, and so did a backport: v1.2.1 tagged after v1.3.0 moved
      # `latest` back to the older line. hack/check-release-latest.sh runs this
      # step against a scratch repository.
      - name: Resolve image, version and tags
        id: meta
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="$REF_NAME"
          if ! printf '%s' "$VERSION" | grep -qE '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z][0-9A-Za-z.-]*)?$'; then
            echo "::error::tag $VERSION is not vMAJOR.MINOR.PATCH[-PRERELEASE]; refusing to publish it"
            exit 1
          fi
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${GITHUB_REPOSITORY##*/}"
          TAGS="$IMAGE:$VERSION"
          case "$VERSION" in
            *-*) PRERELEASE=true ;;
            *)
              PRERELEASE=false
              HIGHEST="$(git tag --list 'v*' --sort=-v:refname \
                | { grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' || true; } | sed -n 1p)"
              if [ -z "$HIGHEST" ]; then
                echo "::error::no final vMAJOR.MINOR.PATCH tag in this checkout, not even $VERSION; the tags were not fetched"
                exit 1
              fi
              if [ "$HIGHEST" = "$VERSION" ]; then
                TAGS="$TAGS,$IMAGE:latest"
              else
                echo "::notice::$VERSION is not the highest final release ($HIGHEST is); latest stays where it is"
              fi
              ;;
          esac
          {
            echo "image=$IMAGE"
            echo "version=$VERSION"
            echo "tags=$TAGS"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $IMAGE:$VERSION (prerelease=$PRERELEASE); tags: $TAGS"

      # A release must install the image it releases. config/base/manager/
      # kustomization.yaml otherwise names :main, a floating tag, so the release's
      # own `kubectl apply -k` would deploy whatever main was last -- not this
      # build, and a different binary next week. Checked before anything is
      # built or pushed, so a forgotten pin costs a re-tag rather than a
      # published image whose manifests do not use it. See
      # docs/developer-guide/release-process.md.
      - name: Verify the kustomization pins this release
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          have="$(awk '$1 == "newTag:" {print $2}' config/base/manager/kustomization.yaml | tr -d '"')"
          if [ "$have" != "$VERSION" ]; then
            echo "::error file=config/base/manager/kustomization.yaml::newTag is '${have}', expected '${VERSION}'. Pin the release tag on the tagged commit (release-process.md, pre-release checklist step 1)."
            exit 1
          fi
          echo "kustomization newTag: ${have}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Scan BEFORE anything is pushed. The scan used to run after the push and
      # could not fail, so a vulnerable image was already public by the time
      # anyone read the table. The amd64 image is built into the local daemon
      # only; the multi-arch build below reuses its layers from the cache.
      - name: Build the amd64 image for scanning (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: release-scan:${{ steps.meta.outputs.version }}
          build-args: |
            IMAGE_SOURCE=${{ github.server_url }}/${{ github.repository }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Blocking: any CRITICAL with a fixed version available stops the release.
      # ignore-unfixed is deliberate -- a CRITICAL with no upstream fix cannot be
      # acted on by rebuilding, and blocking on it would block every release
      # until the base image's maintainers ship one. Those still appear in the
      # non-blocking HIGH,CRITICAL report below.
      - name: Scan for fixable CRITICAL vulnerabilities (blocking)
        uses: ./.github/actions/trivy-scan
        with:
          image: release-scan:${{ steps.meta.outputs.version }}
          severity: CRITICAL
          ignore-unfixed: 'true'
          exit-code: '1'

      - name: Report HIGH and CRITICAL vulnerabilities (non-blocking)
        uses: ./.github/actions/trivy-scan
        with:
          image: release-scan:${{ steps.meta.outputs.version }}

      # The built-in token only. `packages: write` above scopes it to this
      # repository's packages, for this run. A GHCR_TOKEN secret used to win over
      # it: a long-lived token, wider than one package, handed to a job that
      # builds whatever the tagged commit says.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One multi-arch build and push, with an SBOM and a max-mode provenance
      # attestation attached to the index.
      - name: Build and push the multi-arch image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            IMAGE_SOURCE=${{ github.server_url }}/${{ github.repository }}
            GIT_COMMIT=${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          annotations: |
            index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            index:org.opencontainers.image.revision=${{ github.sha }}
            index:org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            index:org.opencontainers.image.description=llm-d-scaling-manager - GPU-aware autoscaler for LLM inference workloads
            index:org.opencontainers.image.licenses=Apache-2.0

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Signed by digest, never by tag: a tag can be moved after signing, a
      # digest cannot. Keyless, so there is no key to leak or rotate; the
      # signature names this workflow and this tag as the signer.
      - name: Sign the image
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          [ -n "$DIGEST" ] || { echo "::error::the push step reported no digest"; exit 1; }
          cosign sign --yes "$IMAGE@$DIGEST"

      - name: Summarise
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
          DIGEST: ${{ steps.push.outputs.digest }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          {
            echo "Pushed \`$IMAGE:$VERSION\` (prerelease: $PRERELEASE)"
            echo ""
            echo "Digest: \`$DIGEST\`"
            echo ""
            echo "Verify the signature:"
            echo '```'
            echo "cosign verify $IMAGE@$DIGEST \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "  --certificate-identity https://github.com/$WORKFLOW_REF"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The files an operator installs from: the manifests rendered by the digest
  # just pushed, each signed like the image, attached to the GitHub Release
  # (docs/proposals/install-from-release.md). Its own job, so the only job that
  # may write the repository's releases builds no image, and the one that
  # pushes the image cannot touch the release. A re-run renders, signs and
  # uploads again, replacing what an earlier attempt attached.
  release-files:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      # Upload to the GitHub Release, creating a draft when none exists.
      contents: write
      # Keyless cosign signing, the same identity that signed the image.
      id-token: write
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false


      # The yq the rendering check runs under in the PR checks (v4.44.3),
      # checked against its digest rather than trusted from the download.
      - name: Install yq
        env:
          YQ_VERSION: v4.44.3
          YQ_SHA256: a2c097180dd884a8d50c956ee16a9cec070f30a7947cf4ebf87d5f36213e9ed7
        run: |
          set -euo pipefail
          curl -fsSL --retry 6 --retry-delay 10 --retry-all-errors -o /tmp/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  /tmp/yq" | sha256sum -c -
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq
          yq --version

      # kustomize is installed by `make kustomize` (KUSTOMIZE_VERSION in the
      # Makefile), which is `go install`: the Go of go.mod, not the runner's.
      - name: Read the Go version from go.mod
        run: sed -En 's/^go (.*)$/GO_VERSION=\1/p' go.mod >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "${{ env.GO_VERSION }}"
          cache: false

      - name: Install kustomize
        run: make kustomize

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Render the release files
        env:
          IMAGE: ${{ needs.release.outputs.image }}
          DIGEST: ${{ needs.release.outputs.digest }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          [ -n "$DIGEST" ] || { echo "::error::the release job reported no digest"; exit 1; }
          make release-manifests IMG="$IMAGE@$DIGEST" RELEASE_VERSION="$VERSION" DIST=dist

      # One bundle per file, SHA256SUMS included: <file>.sigstore.json. Signed
      # by content, so a file changed after signing fails verification.
      - name: Sign the release files
        run: |
          set -euo pipefail
          n=0
          for f in dist/*.yaml dist/SHA256SUMS; do
            [ -f "$f" ] || { echo "::error::$f was not rendered"; exit 1; }
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f" >/dev/null
            n=$((n + 1))
          done
          echo "signed $n files"

      # A draft is created when the tag has no release, and a draft is
      # replaced freely. A PUBLISHED release is not changed: operators may
      # already have downloaded and verified its files, so a re-run whose
      # SHA256SUMS differs from the attached one is refused, and an identical
      # one uploads nothing. (With GitHub immutable releases turned on for the
      # repository, a published release refuses uploads anyway.) Forbidden or
      # any other error reading the release is a failure, never "no release".
      - name: Attach the files to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.release.outputs.version }}
          PRERELEASE: ${{ needs.release.outputs.prerelease }}
        run: |
          set -euo pipefail
          T="$(mktemp -d)"
          rc=0
          draft="$(gh release view "$VERSION" --json isDraft --jq .isDraft 2>"$T/view.err")" || rc=$?
          if [ "$rc" -ne 0 ]; then
            if ! grep -qi 'release not found' "$T/view.err"; then
              echo "::error::cannot read release $VERSION: $(head -1 "$T/view.err")"
              exit 1
            fi
            pre=""
            [ "$PRERELEASE" = true ] && pre="--prerelease"
            # A draft: publishing, with the release notes, stays a maintainer's step.
            gh release create "$VERSION" --draft --verify-tag $pre \
              --title "llm-d-scaling-manager $VERSION" \
              --notes "Install from the attached manifests with kubectl (docs/guides/install-in-namespace), or with make deploy-scaling-manager from a checkout of $VERSION. Release notes to follow."
            draft=true
          fi
          if [ "$draft" != true ]; then
            mkdir -p "$T/published"
            if ! gh release download "$VERSION" --pattern SHA256SUMS --dir "$T/published" 2>"$T/dl.err"; then
              echo "::error::release $VERSION is published and its SHA256SUMS cannot be read ($(head -1 "$T/dl.err")); refusing to attach files to it"
              exit 1
            fi
            if ! cmp -s "$T/published"/SHA256SUMS dist/SHA256SUMS; then
              echo "::error::release $VERSION is published with different files; refusing to replace them. Release a new version instead."
              diff "$T/published"/SHA256SUMS dist/SHA256SUMS || true
              exit 1
            fi
            echo "release $VERSION is published with these exact files; nothing to upload"
            exit 0
          fi
          gh release upload "$VERSION" --clobber dist/*.yaml dist/SHA256SUMS dist/*.sigstore.json
          gh release view "$VERSION" --json assets --jq '.assets[].name'

      - name: Summarise
        env:
          VERSION: ${{ needs.release.outputs.version }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          {
            echo "Attached to release $VERSION:"
            echo '```'
            (cd dist && cat SHA256SUMS)
            echo '```'
            echo "Verify a file (cosign 2.4 or later reads these bundles):"
            echo '```'
            echo "cosign verify-blob scaling-manager-namespaced.yaml \\"
            echo "  --bundle scaling-manager-namespaced.yaml.sigstore.json \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "  --certificate-identity https://github.com/$WORKFLOW_REF"
            echo "sha256sum -c SHA256SUMS --ignore-missing"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
