name: CI - Release - Docker Container Image

# One trigger. This used to run on `push: tags v*` AND `release: published`, so
# a release built and pushed the same image twice. Publishing a release in the
# UI with a new tag creates that tag, which fires this push event.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# One group for every release, not one per tag. Two tags released side by side
# each decide whether they are the highest from the tags they fetched; the
# older run could finish last and move `latest` back. In one group the runs go
# one at a time, and each sees every tag pushed before it started. GitHub keeps
# one run waiting: a third tag pushed meanwhile replaces the waiting one, which
# must then be re-run by hand. hack/check-release-latest.sh checks this block.
concurrency:
  group: ci-release
  cancel-in-progress: false

jobs:
  # The same lint, unit-test, deploy-script, docs and kustomize jobs a PR must
  # pass, run against the tagged commit. Nothing is pushed unless they pass:
  # before this, a tag published an image no workflow had built or tested.
  # (The e2e jobs in that workflow run only on pull_request and skip here.)
  checks:
    uses: ./.github/workflows/ci-pr-checks.yaml
    # packages: write only because ci-pr-checks' warmpool-launcher-image job
    # declares it (its called workflow pushes when the release asks it to), and
    # GitHub refuses to start a run whose nested job asks for more than its
    # caller grants, even when that job would be skipped. It is skipped here
    # (not a pull_request), and every other job in ci-pr-checks takes that
    # workflow's own `contents: read`.
    permissions:
      contents: read
      pull-requests: read
      packages: write

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless cosign signing: the workflow's OIDC identity is the signer.
      id-token: write
    # For the release-sign job, which renders the manifests by this digest.
    outputs:
      image: ${{ steps.meta.outputs.image }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      digest: ${{ steps.push.outputs.digest }}
      # For the release-tools job: whether this release moved `latest`.
      latest: ${{ steps.meta.outputs.latest }}
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Nothing after this needs git credentials; do not leave the token in
          # .git/config beside a docker build context.
          persist-credentials: false
          # Every tag, so the step below can tell whether this one is the
          # highest final release. A shallow checkout has none of the others.
          fetch-depth: 0
          fetch-tags: true

      # Only a commit on a release line is released: one on main, or, for a
      # patch to an older line, one on that line's release-MAJOR.MINOR branch,
      # and only for a line that already has a tag on main. Anyone who may push
      # a tag could otherwise publish, sign and move `latest` to any commit. The
      # branch is the tag's own line, so a v0.11.0 tag on release-0.10 is
      # refused. Review is enforced by branch rules, not here. The full checkout above already
      # holds both branches; each is fetched only if not. A failed fetch leaves
      # the ref missing, which refuses. hack/check-release-latest.sh runs this
      # step too.
      - name: Refuse a tag that is not on main or its release branch
        id: onmain
        run: |
          set -euo pipefail
          if ! git rev-parse --verify -q refs/remotes/origin/main >/dev/null; then
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          fi
          if git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "${GITHUB_SHA} is on main"
            exit 0
          fi
          line="$(printf '%s' "$GITHUB_REF_NAME" | sed -nE 's/^v((0|[1-9][0-9]*)\.(0|[1-9][0-9]*))\.[0-9].*$/\1/p')"
          if [ -n "$line" ]; then
            branch="release-$line"
            if ! git rev-parse --verify -q "refs/remotes/origin/$branch" >/dev/null; then
              git fetch --no-tags origin "+refs/heads/$branch:refs/remotes/origin/$branch" || true
            fi
            if git rev-parse --verify -q "refs/remotes/origin/$branch" >/dev/null \
              && git merge-base --is-ancestor "$GITHUB_SHA" "refs/remotes/origin/$branch"; then
              # Only a line already released from main has a patch branch, so
              # pushing a new release-9.0 branch cannot publish a v9.0.0.
              if [ -z "$(git tag --merged refs/remotes/origin/main --list "v$line.*")" ]; then
                echo "::error::${GITHUB_SHA} is on $branch, but no v$line.* tag is on main; $line was never released from main, refusing to release it"
                exit 1
              fi
              echo "${GITHUB_SHA} is on $branch"
              exit 0
            fi
          fi
          echo "::error::tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on main or on release-${line:-MAJOR.MINOR}; refusing to release it"
          exit 1

      # The image goes to the repository owner's namespace, as ci-main-image.yaml
      # does: ghcr.io/llm-d-incubation/llm-d-scaling-manager here, which is what
      # config/base/manager/kustomization.yaml and the Makefile's IMG name. It
      # used to be hardcoded to ghcr.io/llm-d/..., an org this repository cannot
      # write to.
      #
      # Only the HIGHEST final semver tag moves `latest`. A v1.2.0-rc1 used to
      # overwrite it, and so did a backport: v1.2.1 tagged after v1.3.0 moved
      # `latest` back to the older line. hack/check-release-latest.sh runs this
      # step against a scratch repository.
      - name: Resolve image, version and tags
        id: meta
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="$REF_NAME"
          if ! printf '%s' "$VERSION" | grep -qE '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z][0-9A-Za-z.-]*)?$'; then
            echo "::error::tag $VERSION is not vMAJOR.MINOR.PATCH[-PRERELEASE]; refusing to publish it"
            exit 1
          fi
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${GITHUB_REPOSITORY##*/}"
          TAGS="$IMAGE:$VERSION"
          LATEST=false
          case "$VERSION" in
            *-*) PRERELEASE=true ;;
            *)
              PRERELEASE=false
              HIGHEST="$(git tag --list 'v*' --sort=-v:refname \
                | { grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' || true; } | sed -n 1p)"
              if [ -z "$HIGHEST" ]; then
                echo "::error::no final vMAJOR.MINOR.PATCH tag in this checkout, not even $VERSION; the tags were not fetched"
                exit 1
              fi
              if [ "$HIGHEST" = "$VERSION" ]; then
                TAGS="$TAGS,$IMAGE:latest"
                LATEST=true
              else
                echo "::notice::$VERSION is not the highest final release ($HIGHEST is); latest stays where it is"
              fi
              ;;
          esac
          {
            echo "image=$IMAGE"
            echo "version=$VERSION"
            echo "tags=$TAGS"
            echo "prerelease=$PRERELEASE"
            echo "latest=$LATEST"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $IMAGE:$VERSION (prerelease=$PRERELEASE); tags: $TAGS"

      # A release must install the image it releases. config/base/manager/
      # kustomization.yaml otherwise names :main, a floating tag, so the release's
      # own `kubectl apply -k` would deploy whatever main was last -- not this
      # build, and a different binary next week. Checked before anything is
      # built or pushed, so a forgotten pin costs a re-tag rather than a
      # published image whose manifests do not use it. See
      # docs/developer-guide/release-process.md.
      - name: Verify the kustomization pins this release
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          have="$(awk '$1 == "newTag:" {print $2}' config/base/manager/kustomization.yaml | tr -d '"')"
          if [ "$have" != "$VERSION" ]; then
            echo "::error file=config/base/manager/kustomization.yaml::newTag is '${have}', expected '${VERSION}'. Pin the release tag on the tagged commit (release-process.md, pre-release checklist step 1)."
            exit 1
          fi
          echo "kustomization newTag: ${have}"

      # The same rule for the warm-pool proxy: config/warmpool names its image
      # by tag, :main between releases, and a release PR pins it to the
      # release's tag (deploy/warmpool.sh carries the same reference, kept in
      # step by make warmpool-check in the checks job). The tag alone is
      # compared, as for newTag: the repository part names the owner. Exactly
      # one proxy image line, so a second container cannot hide a stale one.
      - name: Verify the warm-pool proxy image pins this release
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          f=config/warmpool/warmpool-deployment.yaml
          refs="$(awk '$1 == "image:" && $2 ~ /\/warmpool-proxy[:@]/ {print $2}' "$f" | tr -d '"\r')"
          n="$(printf '%s' "$refs" | grep -c . || true)"
          if [ "$n" != 1 ]; then
            echo "::error file=$f::found $n warm-pool proxy image lines, want exactly 1"
            exit 1
          fi
          case "$refs" in
            */warmpool-proxy:"$VERSION") ;;
            *)
              echo "::error file=$f::the proxy image is '${refs}', expected tag '${VERSION}'. Pin it on the tagged commit with make warmpool-render (release-process.md, pre-release checklist step 1)."
              exit 1 ;;
          esac
          echo "warm-pool proxy image: ${refs}"

      # And for the capacity planner's in-cluster manifests: config/capacity-planner
      # names the planner image by newTag, :main between releases.
      # hack/check-capacity-planner-in-cluster.sh keeps it equal to the
      # controller's newTag on every PR; this refuses a tag whose commit names
      # another, before anything is built.
      - name: Verify the capacity planner manifests pin this release
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          f=config/capacity-planner/base/kustomization.yaml
          have="$(awk '$1 == "newTag:" {print $2}' "$f" | tr -d '"\r')"
          if [ "$have" != "$VERSION" ]; then
            echo "::error file=$f::newTag is '${have}', expected '${VERSION}'. Pin the release tag on the tagged commit (release-process.md, pre-release checklist step 1)."
            exit 1
          fi
          echo "capacity planner newTag: ${have}"

      # The tools and controller digests are only available after this run
      # builds the images. The tagged docs must use this release's tag.
      - name: Verify the docs pin this release's images
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          bash deploy/ci-pr-checks/tools-pin.sh check "$VERSION"
          bash deploy/ci-pr-checks/tools-pin.sh --controller check "$VERSION"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Scan BEFORE anything is pushed. The scan used to run after the push and
      # could not fail, so a vulnerable image was already public by the time
      # anyone read the table. The amd64 image is built into the local daemon
      # only; the multi-arch build below reuses its layers from the cache.
      - name: Build the amd64 image for scanning (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: release-scan:${{ steps.meta.outputs.version }}
          build-args: |
            IMAGE_SOURCE=${{ github.server_url }}/${{ github.repository }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Blocking: any CRITICAL with a fixed version available stops the release.
      # ignore-unfixed is deliberate -- a CRITICAL with no upstream fix cannot be
      # acted on by rebuilding, and blocking on it would block every release
      # until the base image's maintainers ship one. Those still appear in the
      # non-blocking HIGH,CRITICAL report below.
      - name: Scan for fixable CRITICAL vulnerabilities (blocking)
        uses: ./.github/actions/trivy-scan
        with:
          image: release-scan:${{ steps.meta.outputs.version }}
          severity: CRITICAL
          ignore-unfixed: 'true'
          exit-code: '1'

      - name: Report HIGH and CRITICAL vulnerabilities (non-blocking)
        uses: ./.github/actions/trivy-scan
        with:
          image: release-scan:${{ steps.meta.outputs.version }}

      # The built-in token only. `packages: write` above scopes it to this
      # repository's packages, for this run. A GHCR_TOKEN secret used to win over
      # it: a long-lived token, wider than one package, handed to a job that
      # builds whatever the tagged commit says.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One multi-arch build and push, with an SBOM and a max-mode provenance
      # attestation attached to the index.
      - name: Build and push the multi-arch image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            IMAGE_SOURCE=${{ github.server_url }}/${{ github.repository }}
            GIT_COMMIT=${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          annotations: |
            index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            index:org.opencontainers.image.revision=${{ github.sha }}
            index:org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            index:org.opencontainers.image.description=llm-d-scaling-manager - GPU-aware autoscaler for LLM inference workloads
            index:org.opencontainers.image.licenses=Apache-2.0

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Signed by digest, never by tag: a tag can be moved after signing, a
      # digest cannot. Keyless, so there is no key to leak or rotate; the
      # signature names this workflow and this tag as the signer.
      - name: Sign the image
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          [ -n "$DIGEST" ] || { echo "::error::the push step reported no digest"; exit 1; }
          cosign sign --yes "$IMAGE@$DIGEST"

      - name: Summarise
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
          DIGEST: ${{ steps.push.outputs.digest }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          {
            echo "Pushed \`$IMAGE:$VERSION\` (prerelease: $PRERELEASE)"
            echo ""
            echo "Digest: \`$DIGEST\`"
            echo ""
            echo "Verify the signature:"
            echo '```'
            echo "cosign verify $IMAGE@$DIGEST \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "  --certificate-identity https://github.com/$WORKFLOW_REF"
            echo '```'
            echo ""
            echo "Pin the controller examples to this digest in the follow-up docs PR:"
            echo '```'
            echo "bash deploy/ci-pr-checks/tools-pin.sh --controller pin @$DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The operator tools image (Dockerfile.tools): prepull, weights,
  # engine-cache, workload-patch, the ScaledObject plan and utilization share
  # for an operator with no checkout
  # (docs/guides/prepare-workloads). Pushed to <controller image>/tools under
  # the same version, moving `latest` only when the controller's did, and
  # scanned and signed the same way. After the release job, so the tag passed
  # its guard on main or a release branch before anything here is pushed.
  # PR checks build it and run hack/check-tools-image.sh on every code change
  # (ci-pr-checks.yaml, tools-image); the checks job above ran those too.
  #
  # It carries the release files (smt install installs them;
  # docs/proposals/two-command-install.md): the artifact release-sign made,
  # checked with cosign verify-blob, baked in by every build here with
  # --build-context release=dist, so the scans cover what ships. A re-run that
  # signs again must rebuild this image in the same run; the upload checks.
  release-tools:
    needs: [release, release-sign]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image: ${{ steps.tools-meta.outputs.image }}
      digest: ${{ steps.tools-push.outputs.digest }}
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Download the signed release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Every file against its bundle, as an operator verifies it, before any
      # of them is baked into an image.
      - name: Verify the release files
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          n=0
          for f in dist/*.yaml dist/scaling-manager-*.sh dist/scaling-manager-tools-*.tar.gz dist/capacity-planner-v*-amd64 dist/capacity-planner-v*-arm64 dist/capacity-planner-v*.exe dist/SHA256SUMS; do
            [ -f "$f" ] && [ -f "$f.sigstore.json" ] || { echo "::error::$f or its bundle is missing from the artifact"; exit 1; }
            cosign verify-blob "$f" --bundle "$f.sigstore.json" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity "https://github.com/$WORKFLOW_REF" >/dev/null
            n=$((n + 1))
          done
          [ "$n" -gt 2 ] || { echo "::error::only $n files verified"; exit 1; }
          (cd dist && sha256sum -c SHA256SUMS)
          echo "verified $n files"
          # Dockerfile.tools requires the baked SHA256SUMS to be this one.
          echo "RELEASE_SHA256SUMS=$(sha256sum dist/SHA256SUMS | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Resolve the tools image and tags
        id: tools-meta
        env:
          IMAGE: ${{ needs.release.outputs.image }}
          VERSION: ${{ needs.release.outputs.version }}
          LATEST: ${{ needs.release.outputs.latest }}
        run: |
          set -euo pipefail
          [ -n "$IMAGE" ] && [ -n "$VERSION" ] || { echo "::error::the release job reported no image or version"; exit 1; }
          TOOLS="$IMAGE/tools"
          TAGS="$TOOLS:$VERSION"
          if [ "$LATEST" = true ]; then
            TAGS="$TAGS,$TOOLS:latest"
          fi
          {
            echo "image=$TOOLS"
            echo "tags=$TAGS"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $TOOLS:$VERSION; tags: $TAGS"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the amd64 tools image for scanning (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.tools
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: release-tools-scan:${{ needs.release.outputs.version }}
          build-contexts: |
            release=dist
          build-args: |
            VERSION=${{ needs.release.outputs.version }}
            RELEASE_SHA256SUMS=${{ env.RELEASE_SHA256SUMS }}
            IMAGE_SOURCE=${{ github.server_url }}/${{ github.repository }}

      - name: Scan the tools image for fixable CRITICAL vulnerabilities (blocking)
        uses: ./.github/actions/trivy-scan
        with:
          image: release-tools-scan:${{ needs.release.outputs.version }}
          severity: CRITICAL
          ignore-unfixed: 'true'
          exit-code: '1'

      - name: Report HIGH and CRITICAL vulnerabilities in the tools image (non-blocking)
        uses: ./.github/actions/trivy-scan
        with:
          image: release-tools-scan:${{ needs.release.outputs.version }}

      # The arm64 image carries other binaries (kubectl, jq, yq per arch), so
      # it is scanned on its own, under QEMU, before anything is pushed.
      - name: Build the arm64 tools image for scanning (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.tools
          platforms: linux/arm64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: release-tools-scan-arm64:${{ needs.release.outputs.version }}
          build-contexts: |
            release=dist
          build-args: |
            VERSION=${{ needs.release.outputs.version }}
            RELEASE_SHA256SUMS=${{ env.RELEASE_SHA256SUMS }}
            IMAGE_SOURCE=${{ github.server_url }}/${{ github.repository }}

      - name: Scan the arm64 tools image for fixable CRITICAL vulnerabilities (blocking)
        uses: ./.github/actions/trivy-scan
        with:
          image: release-tools-scan-arm64:${{ needs.release.outputs.version }}
          severity: CRITICAL
          ignore-unfixed: 'true'
          exit-code: '1'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the multi-arch tools image
        id: tools-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.tools
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tools-meta.outputs.tags }}
          build-contexts: |
            release=dist
          build-args: |
            VERSION=${{ needs.release.outputs.version }}
            RELEASE_SHA256SUMS=${{ env.RELEASE_SHA256SUMS }}
            IMAGE_SOURCE=${{ github.server_url }}/${{ github.repository }}
          sbom: true
          provenance: mode=max
          annotations: |
            index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            index:org.opencontainers.image.revision=${{ github.sha }}
            index:org.opencontainers.image.version=${{ needs.release.outputs.version }}
            index:org.opencontainers.image.description=llm-d-scaling-manager tools - install the scaling manager and prepare model servers for scaling
            index:org.opencontainers.image.licenses=Apache-2.0

      - name: Sign the tools image
        env:
          IMAGE: ${{ steps.tools-meta.outputs.image }}
          DIGEST: ${{ steps.tools-push.outputs.digest }}
        run: |
          set -euo pipefail
          [ -n "$DIGEST" ] || { echo "::error::the push step reported no digest"; exit 1; }
          cosign sign --yes "$IMAGE@$DIGEST"

      - name: Summarise
        env:
          IMAGE: ${{ steps.tools-meta.outputs.image }}
          VERSION: ${{ needs.release.outputs.version }}
          DIGEST: ${{ steps.tools-push.outputs.digest }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          {
            echo "Pushed \`$IMAGE:$VERSION\`, with the release files baked in"
            echo ""
            echo "Digest: \`$DIGEST\`"
            echo ""
            echo "Verify the signature (smt install trusts the files this image carries):"
            echo '```'
            echo "cosign verify $IMAGE@$DIGEST \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "  --certificate-identity https://github.com/$WORKFLOW_REF"
            echo '```'
            echo ""
            echo "The docs PR pins this digest (release-process.md, step 5):"
            echo '```'
            echo "bash deploy/ci-pr-checks/tools-pin.sh pin @$DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The capacity planner image (Dockerfile.capacity-planner): the planner's
  # API for an operator with no checkout (docs/guides/capacity-planner). The
  # planner replays recordings with the controller's learners, so it is
  # released under the controller's tag, to <controller image>/capacity-planner,
  # moving `latest` only when the controller's did. Built, scanned, pushed and
  # signed as release-tools does; one scan, as for the controller, since both
  # platforms carry the same pure-Go binary. Before anything is pushed, the
  # amd64 build is run by hack/check-capacity-planner-image.sh, which needs it
  # to serve a plan and print this version. PR checks run the same script
  # (ci-pr-checks.yaml, capacity-planner-image); the checks job above ran it.
  release-capacity-planner:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Resolve the capacity planner image and tags
        id: planner-meta
        env:
          IMAGE: ${{ needs.release.outputs.image }}
          VERSION: ${{ needs.release.outputs.version }}
          LATEST: ${{ needs.release.outputs.latest }}
        run: |
          set -euo pipefail
          [ -n "$IMAGE" ] && [ -n "$VERSION" ] || { echo "::error::the release job reported no image or version"; exit 1; }
          PLANNER="$IMAGE/capacity-planner"
          TAGS="$PLANNER:$VERSION"
          if [ "$LATEST" = true ]; then
            TAGS="$TAGS,$PLANNER:latest"
          fi
          {
            echo "image=$PLANNER"
            echo "tags=$TAGS"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $PLANNER:$VERSION; tags: $TAGS"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the amd64 capacity planner image for checking and scanning (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.capacity-planner
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: release-planner-scan:${{ needs.release.outputs.version }}
          build-args: |
            VERSION=${{ needs.release.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            IMAGE_SOURCE=${{ github.server_url }}/${{ github.repository }}

      - name: Check the capacity planner image serves a plan and prints this release
        env:
          PLANNER_IMG: release-planner-scan:${{ needs.release.outputs.version }}
          PLANNER_VERSION: ${{ needs.release.outputs.version }}
        run: bash hack/check-capacity-planner-image.sh

      - name: Scan the capacity planner image for fixable CRITICAL vulnerabilities (blocking)
        uses: ./.github/actions/trivy-scan
        with:
          image: release-planner-scan:${{ needs.release.outputs.version }}
          severity: CRITICAL
          ignore-unfixed: 'true'
          exit-code: '1'

      - name: Report HIGH and CRITICAL vulnerabilities in the capacity planner image (non-blocking)
        uses: ./.github/actions/trivy-scan
        with:
          image: release-planner-scan:${{ needs.release.outputs.version }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the multi-arch capacity planner image
        id: planner-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.capacity-planner
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.planner-meta.outputs.tags }}
          build-args: |
            VERSION=${{ needs.release.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            IMAGE_SOURCE=${{ github.server_url }}/${{ github.repository }}
          sbom: true
          provenance: mode=max
          annotations: |
            index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            index:org.opencontainers.image.revision=${{ github.sha }}
            index:org.opencontainers.image.version=${{ needs.release.outputs.version }}
            index:org.opencontainers.image.description=llm-d-scaling-manager capacity planner - price a fleet from a learner recording
            index:org.opencontainers.image.licenses=Apache-2.0

      # The pushed index, by digest, must hold both release platforms: a
      # release whose arm64 image is missing fails here, not on a laptop.
      - name: Verify the pushed image holds linux/amd64 and linux/arm64
        env:
          IMAGE: ${{ steps.planner-meta.outputs.image }}
          DIGEST: ${{ steps.planner-push.outputs.digest }}
        run: |
          set -euo pipefail
          [ -n "$DIGEST" ] || { echo "::error::the push step reported no digest"; exit 1; }
          have="$(docker buildx imagetools inspect "$IMAGE@$DIGEST" --format '{{json .Manifest}}' \
            | jq -r '[.manifests[].platform | select(.os != "unknown") | .os + "/" + .architecture] | sort | unique | join(",")')"
          if [ "$have" != "linux/amd64,linux/arm64" ]; then
            echo "::error::$IMAGE@$DIGEST holds [$have], want linux/amd64,linux/arm64"
            exit 1
          fi
          echo "$IMAGE@$DIGEST: $have"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the capacity planner image
        env:
          IMAGE: ${{ steps.planner-meta.outputs.image }}
          DIGEST: ${{ steps.planner-push.outputs.digest }}
        run: |
          set -euo pipefail
          [ -n "$DIGEST" ] || { echo "::error::the push step reported no digest"; exit 1; }
          cosign sign --yes "$IMAGE@$DIGEST"

      - name: Summarise
        env:
          IMAGE: ${{ steps.planner-meta.outputs.image }}
          VERSION: ${{ needs.release.outputs.version }}
          DIGEST: ${{ steps.planner-push.outputs.digest }}
        run: |
          {
            echo "Pushed \`$IMAGE:$VERSION\`"
            echo ""
            echo "Digest: \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # The warm-pool proxy image (Dockerfile.warmpool-proxy): the sidecar in every
  # warm-pool Pod. config/warmpool and deploy/warmpool.sh name it by the
  # release's tag on the tagged commit (the release job checked that), so it is
  # released under the controller's tag, to <controller image>/warmpool-proxy,
  # moving `latest` only when the controller's did. Built, scanned, pushed and
  # signed as release-capacity-planner does. QEMU, because the builder stage
  # of Dockerfile.warmpool-proxy runs on the target platform.
  release-warmpool-proxy:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Resolve the warm-pool proxy image and tags
        id: proxy-meta
        env:
          IMAGE: ${{ needs.release.outputs.image }}
          VERSION: ${{ needs.release.outputs.version }}
          LATEST: ${{ needs.release.outputs.latest }}
        run: |
          set -euo pipefail
          [ -n "$IMAGE" ] && [ -n "$VERSION" ] || { echo "::error::the release job reported no image or version"; exit 1; }
          PROXY="$IMAGE/warmpool-proxy"
          TAGS="$PROXY:$VERSION"
          if [ "$LATEST" = true ]; then
            TAGS="$TAGS,$PROXY:latest"
          fi
          {
            echo "image=$PROXY"
            echo "tags=$TAGS"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $PROXY:$VERSION; tags: $TAGS"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the amd64 warm-pool proxy image for scanning (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.warmpool-proxy
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: release-proxy-scan:${{ needs.release.outputs.version }}

      - name: Scan the warm-pool proxy image for fixable CRITICAL vulnerabilities (blocking)
        uses: ./.github/actions/trivy-scan
        with:
          image: release-proxy-scan:${{ needs.release.outputs.version }}
          severity: CRITICAL
          ignore-unfixed: 'true'
          exit-code: '1'

      - name: Report HIGH and CRITICAL vulnerabilities in the warm-pool proxy image (non-blocking)
        uses: ./.github/actions/trivy-scan
        with:
          image: release-proxy-scan:${{ needs.release.outputs.version }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the multi-arch warm-pool proxy image
        id: proxy-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.warmpool-proxy
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.proxy-meta.outputs.tags }}
          sbom: true
          provenance: mode=max
          annotations: |
            index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            index:org.opencontainers.image.revision=${{ github.sha }}
            index:org.opencontainers.image.version=${{ needs.release.outputs.version }}
            index:org.opencontainers.image.description=llm-d-scaling-manager warm-pool proxy - forwards the serving port of a pool Pod to the model awake in it
            index:org.opencontainers.image.licenses=Apache-2.0

      - name: Verify the pushed image holds linux/amd64 and linux/arm64
        env:
          IMAGE: ${{ steps.proxy-meta.outputs.image }}
          DIGEST: ${{ steps.proxy-push.outputs.digest }}
        run: |
          set -euo pipefail
          [ -n "$DIGEST" ] || { echo "::error::the push step reported no digest"; exit 1; }
          have="$(docker buildx imagetools inspect "$IMAGE@$DIGEST" --format '{{json .Manifest}}' \
            | jq -r '[.manifests[].platform | select(.os != "unknown") | .os + "/" + .architecture] | sort | unique | join(",")')"
          if [ "$have" != "linux/amd64,linux/arm64" ]; then
            echo "::error::$IMAGE@$DIGEST holds [$have], want linux/amd64,linux/arm64"
            exit 1
          fi
          echo "$IMAGE@$DIGEST: $have"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the warm-pool proxy image
        env:
          IMAGE: ${{ steps.proxy-meta.outputs.image }}
          DIGEST: ${{ steps.proxy-push.outputs.digest }}
        run: |
          set -euo pipefail
          [ -n "$DIGEST" ] || { echo "::error::the push step reported no digest"; exit 1; }
          cosign sign --yes "$IMAGE@$DIGEST"

      - name: Summarise
        env:
          IMAGE: ${{ steps.proxy-meta.outputs.image }}
          VERSION: ${{ needs.release.outputs.version }}
          DIGEST: ${{ steps.proxy-push.outputs.digest }}
        run: |
          {
            echo "Pushed \`$IMAGE:$VERSION\`"
            echo ""
            echo "Digest: \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # The warm-pool launcher image (Dockerfile.warmpool-launcher): the vendored
  # launcher in warmpool/supervisor/ on the vLLM base, released under the
  # controller's tag to <controller image>/warmpool-launcher, moving `latest`
  # only when the controller's did. The base is multi-arch, so the image is
  # too. ci-warmpool-launcher.yaml builds each platform on its own native
  # runner and pushes it by digest; release-warmpool-launcher joins the two
  # into one index under the release's tags and signs it. That workflow can be
  # dispatched by hand as a dry run of these legs. Nothing installs this image
  # by default yet, so release-files does not wait for it.
  release-warmpool-launcher-build:
    needs: release
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci-warmpool-launcher.yaml
    with:
      image: ${{ needs.release.outputs.image }}/warmpool-launcher
      push: true

  release-warmpool-launcher:
    needs: [release, release-warmpool-launcher-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      # For the local trivy-scan action only.
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Resolve the warm-pool launcher image and tags
        id: launcher-meta
        env:
          IMAGE: ${{ needs.release.outputs.image }}
          VERSION: ${{ needs.release.outputs.version }}
          LATEST: ${{ needs.release.outputs.latest }}
        run: |
          set -euo pipefail
          [ -n "$IMAGE" ] && [ -n "$VERSION" ] || { echo "::error::the release job reported no image or version"; exit 1; }
          LAUNCHER="$IMAGE/warmpool-launcher"
          TAGS="$LAUNCHER:$VERSION"
          if [ "$LATEST" = true ]; then
            TAGS="$TAGS $LAUNCHER:latest"
          fi
          {
            echo "image=$LAUNCHER"
            echo "tags=$TAGS"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $LAUNCHER:$VERSION; tags: $TAGS"

      - name: Download the per-platform digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: warmpool-launcher-digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/launcher-digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One index holding both platforms, under the release's tags. Exactly the
      # two digests the build legs pushed: a missing leg fails here.
      - name: Join the platforms into one tagged index
        id: launcher-index
        env:
          IMAGE: ${{ steps.launcher-meta.outputs.image }}
          TAGS: ${{ steps.launcher-meta.outputs.tags }}
          VERSION: ${{ needs.release.outputs.version }}
          DIR: ${{ runner.temp }}/launcher-digests
        run: |
          set -euo pipefail
          srcs=()
          for arch in amd64 arm64; do
            d="$(tr -d '[:space:]' < "$DIR/$arch")"
            case "$d" in
              sha256:*) srcs+=("$IMAGE@$d") ;;
              *) echo "::error::no digest for $arch: '$d'"; exit 1 ;;
            esac
          done
          targs=()
          for t in $TAGS; do targs+=(-t "$t"); done
          docker buildx imagetools create "${targs[@]}" \
            --annotation "index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --annotation "index:org.opencontainers.image.revision=${{ github.sha }}" \
            --annotation "index:org.opencontainers.image.version=${VERSION}" \
            --annotation "index:org.opencontainers.image.description=llm-d-scaling-manager warm-pool launcher - starts, lists and stops vLLM engines in a pool Pod" \
            --annotation "index:org.opencontainers.image.licenses=Apache-2.0" \
            "${srcs[@]}"
          digest="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r '.digest')"
          case "$digest" in
            sha256:*) ;;
            *) echo "::error::could not read the digest of $IMAGE:$VERSION"; exit 1 ;;
          esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Verify the pushed image holds linux/amd64 and linux/arm64
        env:
          IMAGE: ${{ steps.launcher-meta.outputs.image }}
          DIGEST: ${{ steps.launcher-index.outputs.digest }}
        run: |
          set -euo pipefail
          have="$(docker buildx imagetools inspect "$IMAGE@$DIGEST" --format '{{json .Manifest}}' \
            | jq -r '[.manifests[].platform | select(.os != "unknown") | .os + "/" + .architecture] | sort | unique | join(",")')"
          if [ "$have" != "linux/amd64,linux/arm64" ]; then
            echo "::error::$IMAGE@$DIGEST holds [$have], want linux/amd64,linux/arm64"
            exit 1
          fi
          echo "$IMAGE@$DIGEST: $have"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the warm-pool launcher image
        env:
          IMAGE: ${{ steps.launcher-meta.outputs.image }}
          DIGEST: ${{ steps.launcher-index.outputs.digest }}
        run: |
          set -euo pipefail
          [ -n "$DIGEST" ] || { echo "::error::no index digest"; exit 1; }
          cosign sign --yes "$IMAGE@$DIGEST"

      # Report only, and after signing: most of the image is vLLM's, so a
      # blocking scan would hold our release on fixes only vLLM can ship, and
      # trivy pulling the ~10 GB image must not be able to fail the job.
      - name: Free disk space for the scan
        continue-on-error: true
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Report HIGH and CRITICAL vulnerabilities in the launcher image (non-blocking)
        continue-on-error: true
        uses: ./.github/actions/trivy-scan
        with:
          image: ${{ steps.launcher-meta.outputs.image }}@${{ steps.launcher-index.outputs.digest }}

      - name: Summarise
        env:
          IMAGE: ${{ steps.launcher-meta.outputs.image }}
          VERSION: ${{ needs.release.outputs.version }}
          DIGEST: ${{ steps.launcher-index.outputs.digest }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          {
            echo "Pushed \`$IMAGE:$VERSION\`"
            echo ""
            echo "Digest: \`$DIGEST\` (copy it into the release notes)"
            echo ""
            echo "Verify the signature:"
            echo '```'
            echo "cosign verify $IMAGE@$DIGEST \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "  --certificate-identity https://github.com/$WORKFLOW_REF"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The files an operator installs from: the manifests rendered by the digest
  # just pushed, each signed like the image (docs/proposals/install-from-release.md).
  # The only place bundles are made: cosign sign-blob makes a new bundle on
  # every run, so the tools image (release-tools) and the GitHub Release
  # (release-files) both take this job's artifact, never a render of their own
  # (docs/proposals/two-command-install.md). It also builds the capacity
  # planner binaries and adds them to SHA256SUMS before it is signed, so
  # every file of the release is signed here, once. It may sign, and write
  # nothing.
  release-sign:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Keyless cosign signing, the same identity that signed the image.
      id-token: write
    env:
      # The capacity planner binaries the release attaches, one per platform
      # (make capacity-planner-dist), .exe on windows. A missing one fails the job.
      CAPACITY_PLANNER_PLATFORMS: linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false


      # The yq the rendering check runs under in the PR checks (v4.54.1),
      # checked against its digest rather than trusted from the download.
      - name: Install yq
        env:
          YQ_VERSION: v4.54.1
          YQ_SHA256: 8e34fc298390875de416e6a4afcb8cabeceb25d9aa8506c1a2f9353cf702ea5f
        run: |
          set -euo pipefail
          curl -fsSL --retry 6 --retry-delay 10 --retry-all-errors -o /tmp/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  /tmp/yq" | sha256sum -c -
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq
          yq --version

      # kustomize is installed by `make kustomize` (KUSTOMIZE_VERSION in the
      # Makefile), which is `go install`, and the capacity planner binaries
      # are built here. The Go line of go.mod (1.26 for go 1.26.0), at its
      # latest patch (check-latest), as the image's golang:1.26 builder is:
      # go.mod's own 1.26.0 would ship that release's standard library and
      # every fix since missing from it.
      - name: Read the Go line from go.mod
        run: sed -En 's/^go ([0-9]+\.[0-9]+)(\..*)?$/GO_VERSION=\1/p' go.mod >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "${{ env.GO_VERSION }}"
          check-latest: true
          cache: false

      - name: Install kustomize
        run: make kustomize

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Render the release files
        env:
          IMAGE: ${{ needs.release.outputs.image }}
          DIGEST: ${{ needs.release.outputs.digest }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          [ -n "$DIGEST" ] || { echo "::error::the release job reported no digest"; exit 1; }
          make release-manifests IMG="$IMAGE@$DIGEST" RELEASE_VERSION="$VERSION" DIST=dist

      # Signing again makes new bundles, so a re-run for a release already
      # published would push a tools image whose bundles differ from the ones
      # attached: refuse before signing. Read-only; any error reading the
      # release is a refusal, never "no release".
      - name: Refuse a release that is already published
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          T="$(mktemp -d)"
          rc=0
          draft="$(gh release view "$VERSION" --json isDraft --jq .isDraft 2>"$T/view.err")" || rc=$?
          if [ "$rc" -ne 0 ]; then
            if grep -qi 'release not found' "$T/view.err"; then
              echo "no release $VERSION yet"
              exit 0
            fi
            echo "::error::cannot read release $VERSION: $(head -1 "$T/view.err")"
            exit 1
          fi
          if [ "$draft" != true ]; then
            echo "::error::release $VERSION is already published; signing again would bake other bundles into the tools image. Release a new version instead."
            exit 1
          fi
          echo "release $VERSION is a draft"

      # The planner binaries, with the ldflags of `make capacity-planner` and
      # this release, -trimpath so a re-run builds the same bytes. Each must
      # exist, the linux/amd64 one must print this release and commit, and all
      # are added to the SHA256SUMS the render wrote, before it is signed.
      # Blocking: a known vulnerability in code the planner calls, in the
      # standard library of this Go or in a module, stops the release.
      # Source mode, so a finding in code never called is listed but does not
      # block. Pinned by version; the Go checksum database verifies the module.
      - name: Scan the capacity planner for called vulnerabilities (blocking)
        run: |
          set -euo pipefail
          go version
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./cmd/capacity-planner/...
          # The windows binary's own files and standard library too: the
          # tool built for this runner, then run with GOOS=windows (go run
          # would build it for windows).
          GOBIN="$RUNNER_TEMP/bin" go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          GOOS=windows "$RUNNER_TEMP/bin/govulncheck" ./cmd/capacity-planner/...

      - name: Build the capacity planner binaries
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          make capacity-planner-dist RELEASE_VERSION="$VERSION" DIST=dist GIT_COMMIT="$GITHUB_SHA" \
            CAPACITY_PLANNER_PLATFORMS="$CAPACITY_PLANNER_PLATFORMS"
          names=()
          for p in $CAPACITY_PLANNER_PLATFORMS; do
            f="capacity-planner-$VERSION-$(printf '%s' "$p" | tr / -)"
            case "$p" in windows/*) f="$f.exe" ;; esac
            [ -s "dist/$f" ] || { echo "::error::dist/$f was not built"; exit 1; }
            names+=("$f")
          done
          got="$(dist/capacity-planner-"$VERSION"-linux-amd64 version)"
          want="capacity-planner $VERSION (commit $GITHUB_SHA)"
          [ "$got" = "$want" ] || { echo "::error::the linux/amd64 binary prints '$got', want '$want'"; exit 1; }
          (cd dist && sha256sum "${names[@]}" >> SHA256SUMS)
          echo "added ${#names[@]} binaries to SHA256SUMS: ${names[*]}"

      # One bundle per file, SHA256SUMS included: <file>.sigstore.json. Signed
      # by content, so a file changed after signing fails verification.
      - name: Sign the release files
        run: |
          set -euo pipefail
          n=0
          for f in dist/*.yaml dist/scaling-manager-*.sh dist/scaling-manager-tools-*.tar.gz dist/capacity-planner-v*-amd64 dist/capacity-planner-v*-arm64 dist/capacity-planner-v*.exe dist/SHA256SUMS; do
            [ -f "$f" ] || { echo "::error::$f was not rendered"; exit 1; }
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f" >/dev/null
            n=$((n + 1))
          done
          echo "signed $n files"

      - name: Upload the signed release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 30
          # A re-run of this job replaces the artifact of the earlier attempt.
          overwrite: true

  # Attaches release-sign's artifact to the GitHub Release: the same bytes the
  # tools image carries, never rendered or signed again. Its own job, so the
  # only job that may write the repository's releases builds no image and
  # signs nothing, and the one that pushes the image cannot touch the release.
  # Re-running it alone reuses the artifact.
  release-files:
    # After release-tools, release-capacity-planner and release-warmpool-proxy
    # too: a draft release whose notes and guides point at an image that failed
    # to push would install half a release.
    needs: [release, release-sign, release-tools, release-capacity-planner, release-warmpool-proxy]
    runs-on: ubuntu-latest
    permissions:
      # Upload to the GitHub Release, creating a draft when none exists.
      contents: write
      # Pull the tools image just pushed, to compare its files.
      packages: read
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Download the signed release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The tools image, by digest, must carry exactly these files: its baked
      # SHA256SUMS and every bundle equal to the artifact's, in both variants
      # it publishes. A re-run of the signing job without a rebuild of the
      # image fails here.
      - name: Check the tools image carries these files
        env:
          IMAGE: ${{ needs.release-tools.outputs.image }}
          DIGEST: ${{ needs.release-tools.outputs.digest }}
        run: |
          set -euo pipefail
          [ -n "$IMAGE" ] && [ -n "$DIGEST" ] || { echo "::error::the release-tools job reported no image or digest"; exit 1; }
          for platform in linux/amd64 linux/arm64; do
            docker pull -q --platform "$platform" "$IMAGE@$DIGEST" >/dev/null
            bash hack/compare-baked-release-files.sh --platform "$platform" --image "$IMAGE@$DIGEST" dist
          done

      # A draft is created when the tag has no release, and a draft is
      # replaced freely. A PUBLISHED release is not changed: operators may
      # already have downloaded and verified its files, so a re-run whose
      # SHA256SUMS differs from the attached one is refused, and an identical
      # one uploads nothing. (With GitHub immutable releases turned on for the
      # repository, a published release refuses uploads anyway.) Forbidden or
      # any other error reading the release is a failure, never "no release".
      - name: Attach the files to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.release.outputs.version }}
          PRERELEASE: ${{ needs.release.outputs.prerelease }}
        run: |
          set -euo pipefail
          T="$(mktemp -d)"
          rc=0
          draft="$(gh release view "$VERSION" --json isDraft --jq .isDraft 2>"$T/view.err")" || rc=$?
          if [ "$rc" -ne 0 ]; then
            if ! grep -qi 'release not found' "$T/view.err"; then
              echo "::error::cannot read release $VERSION: $(head -1 "$T/view.err")"
              exit 1
            fi
            pre=""
            [ "$PRERELEASE" = true ] && pre="--prerelease"
            # A draft: publishing, with the release notes, stays a maintainer's step.
            gh release create "$VERSION" --draft --verify-tag $pre \
              --title "llm-d-scaling-manager $VERSION" \
              --notes "Install from the attached manifests with kubectl (docs/guides/install-in-namespace), or with make deploy-scaling-manager from a checkout of $VERSION. Release notes to follow."
            draft=true
          fi
          if [ "$draft" != true ]; then
            mkdir -p "$T/published"
            if ! gh release download "$VERSION" --pattern SHA256SUMS --dir "$T/published" 2>"$T/dl.err"; then
              echo "::error::release $VERSION is published and its SHA256SUMS cannot be read ($(head -1 "$T/dl.err")); refusing to attach files to it"
              exit 1
            fi
            if ! cmp -s "$T/published"/SHA256SUMS dist/SHA256SUMS; then
              echo "::error::release $VERSION is published with different files; refusing to replace them. Release a new version instead."
              diff "$T/published"/SHA256SUMS dist/SHA256SUMS || true
              exit 1
            fi
            echo "release $VERSION is published with these exact files; nothing to upload"
            exit 0
          fi
          gh release upload "$VERSION" --clobber dist/*.yaml dist/scaling-manager-*.sh dist/scaling-manager-tools-*.tar.gz \
            dist/capacity-planner-v*-amd64 dist/capacity-planner-v*-arm64 dist/capacity-planner-v*.exe dist/SHA256SUMS dist/*.sigstore.json
          gh release view "$VERSION" --json assets --jq '.assets[].name'

      - name: Summarise
        env:
          VERSION: ${{ needs.release.outputs.version }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          {
            echo "Attached to release $VERSION:"
            echo '```'
            (cd dist && cat SHA256SUMS)
            echo '```'
            echo "Verify a file (cosign 2.4 or later reads these bundles):"
            echo '```'
            echo "cosign verify-blob scaling-manager-namespaced.yaml \\"
            echo "  --bundle scaling-manager-namespaced.yaml.sigstore.json \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "  --certificate-identity https://github.com/$WORKFLOW_REF"
            echo "sha256sum -c SHA256SUMS --ignore-missing"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
